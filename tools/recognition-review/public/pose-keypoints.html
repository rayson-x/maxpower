  <style>

    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--void);color:var(--paper)}body{overflow:hidden;font-family:var(--condensed)}button,input,select,textarea{font:inherit;color:inherit}[hidden]{display:none!important}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--acid);outline-offset:2px}
    .shell{height:100vh;display:grid;grid-template-rows:76px minmax(0,1fr);overflow:hidden}.masthead{display:grid;grid-template-columns:minmax(470px,1fr) auto;border-bottom:1px solid var(--line);background:#090b0c}.brand{display:flex;align-items:center;gap:14px;min-width:0;padding:10px 18px}.brand-mark{width:51px;height:51px;display:grid;place-items:center;border:1px solid var(--violet);color:var(--violet);font:900 13px/1 var(--mono);transform:rotate(2deg)}.eyebrow{margin:0 0 5px;color:var(--violet);font:800 8px/1 var(--mono);letter-spacing:.15em;text-transform:uppercase}h1{margin:0;font:600 27px/.95 var(--display);letter-spacing:-.035em}.subcopy{margin:6px 0 0;color:var(--muted);font:9px/1.2 var(--mono)}.nav{margin-left:auto;display:flex;gap:6px}.nav a{padding:8px;border:1px solid var(--line);color:var(--muted);text-decoration:none;font:700 7px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase}.nav a:hover{border-color:var(--violet);color:var(--violet)}

    .workspace{min-height:0;display:grid;grid-template-columns:300px minmax(520px,1fr) 382px;overflow:hidden}.rail,.inspector{min-height:0;background:var(--panel)}.rail{display:grid;grid-template-rows:auto auto minmax(0,1fr);border-right:1px solid var(--line)}.inspector{border-left:1px solid var(--line);overflow-y:auto}.viewer{min-width:0;min-height:0;display:grid;grid-template-rows:minmax(380px,1fr) auto;background:#030405}
    .filters{padding:12px;border-bottom:1px solid var(--line)}.search{width:100%;height:34px;padding:0 9px;border:1px solid var(--line);border-radius:0;background:#070a0b}.filter-label{margin:11px 0 6px;color:var(--muted);font:700 7px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase}.segmented{display:grid;grid-template-columns:repeat(var(--cols,4),1fr);border:1px solid var(--line)}.filter-btn{min-height:28px;padding:0 4px;border:0;border-right:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;font:700 7px/1 var(--mono)}.filter-btn:last-child{border-right:0}.filter-btn.active{background:var(--acid);color:var(--void)}.select-row{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}select,input,textarea{border-radius:0;border:1px solid var(--line);background:#080b0c}select{min-width:0;height:31px;padding:0 6px;font-size:9px}
    .queue-summary{padding:11px 12px;border-bottom:1px solid var(--line);background:#131719}.summary-line{display:flex;justify-content:space-between;color:var(--muted);font:8px/1.4 var(--mono)}.summary-line strong{color:var(--paper)}.progress{height:3px;margin-top:8px;background:#2b3335}.progress i{display:block;height:100%;width:0;background:var(--acid);transition:width .2s}.queue{min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}.queue-count{position:sticky;top:0;z-index:3;padding:8px 11px;border-bottom:1px solid #252b2d;background:var(--panel);color:var(--muted);font:700 7px/1 var(--mono);letter-spacing:.08em}.queue-card{--status:var(--line);width:100%;display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px 10px;border:0;border-bottom:1px solid #242a2c;background:transparent;text-align:left;cursor:pointer}.queue-card:hover{background:#171d1f}.queue-card.active{background:var(--acid);color:var(--void)}.queue-card.submitted{--status:var(--acid)}.queue-card.draft{--status:var(--amber)}.queue-card.disagreement{--status:var(--ember)}.queue-glyph{width:27px;height:27px;display:grid;place-items:center;border:1px solid var(--status);color:var(--status);font:800 9px/1 var(--mono)}.queue-card.active .queue-glyph{border-color:#63732d;color:var(--void)}.queue-title{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font:700 10px/1.1 var(--mono)}.queue-meta{display:block;margin-top:5px;color:var(--muted);font:700 7px/1 var(--mono);text-transform:uppercase}.queue-card.active .queue-meta{color:#58643a}.score{padding:4px;border:1px solid var(--line);color:var(--muted);font:700 7px/1 var(--mono)}.queue-card.active .score{border-color:#65733d;color:#39430e}
    .stage{position:relative;min-height:0;overflow:hidden;background:radial-gradient(circle at 50% 45%,#171a20 0,#050607 68%);touch-action:none}.stage::after{content:"";position:absolute;inset:17px;z-index:5;pointer-events:none;border:1px solid rgba(174,140,255,.14)}.stage-img,.pose-canvas{position:absolute;inset:0;width:100%;height:100%}.stage-img{object-fit:contain;user-select:none;-webkit-user-drag:none}.pose-canvas{z-index:3;cursor:crosshair}.stage-grid{position:absolute;inset:17px;z-index:1;pointer-events:none;opacity:.12;background-image:linear-gradient(rgba(174,140,255,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(174,140,255,.16) 1px,transparent 1px);background-size:10% 10%}.stage-labels{position:absolute;z-index:6;left:27px;top:27px;right:27px;display:flex;justify-content:space-between;pointer-events:none}.chip{display:inline-flex;min-height:24px;align-items:center;padding:0 7px;border:1px solid var(--line);background:rgba(6,7,8,.86);color:var(--muted);font:800 7px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase}.chip.violet{border-color:var(--violet);color:var(--violet)}.chip.acid{border-color:var(--acid);color:var(--acid)}.loading{position:absolute;inset:0;z-index:9;display:grid;place-content:center;background:#07090a;color:var(--violet);font:800 9px/1 var(--mono);letter-spacing:.15em}
    .transport{padding:11px 15px;border-top:1px solid var(--line);background:#0b0f10}.transport-main{display:grid;grid-template-columns:auto auto auto auto auto 1fr auto;gap:7px;align-items:center}.transport button{min-height:31px;padding:0 9px;border:1px solid var(--line);background:var(--raised);cursor:pointer;font:800 8px/1 var(--mono)}.transport button.primary{border-color:var(--violet);color:var(--violet)}.layer.active.raw{border-color:var(--cyan);color:var(--cyan)}.layer.active.rust{border-color:var(--amber);color:var(--amber)}.layer.active.human{border-color:var(--acid);color:var(--acid)}.transport-note{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--muted);font:8px/1.3 var(--mono)}.shortcut{font:700 8px/1.4 var(--mono)}.shortcut b{color:var(--acid)}
    .inspector-head{position:relative;padding:16px;border-bottom:1px solid var(--line)}.inspector-head::before{content:"";position:absolute;left:0;top:0;width:5px;height:42px;background:var(--violet)}.case-number{color:var(--muted);font:800 8px/1 var(--mono);letter-spacing:.1em}.case-title{margin:8px 0 0;font:600 23px/1 var(--display)}.case-id{margin:7px 0 0;color:var(--muted);overflow-wrap:anywhere;font:8px/1.4 var(--mono)}.policy{margin-top:11px;padding:9px;border-left:2px solid var(--amber);background:#19160d;color:#d5c579;font:8px/1.45 var(--mono)}.section{padding:13px 16px;border-bottom:1px solid var(--line)}.section-label{margin:0 0 9px;color:var(--muted);font:800 7px/1 var(--mono);letter-spacing:.13em;text-transform:uppercase}
    .joint-list{display:grid;grid-template-columns:1fr 1fr;gap:5px}.joint-card{display:grid;grid-template-columns:25px minmax(0,1fr) auto;gap:6px;align-items:center;min-height:38px;padding:6px;border:1px solid var(--line);background:#090c0d;cursor:pointer;text-align:left}.joint-card.active{border-color:var(--acid);background:#151b0e}.joint-num{width:23px;height:23px;display:grid;place-items:center;background:#242b2d;color:var(--muted);font:800 8px/1 var(--mono)}.joint-card.active .joint-num{background:var(--acid);color:var(--void)}.joint-name{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font:700 8px/1 var(--mono)}.joint-state{width:17px;height:17px;display:grid;place-items:center;border:1px solid var(--line);font:900 7px/1 var(--mono)}.joint-state.visible{border-color:var(--acid);color:var(--acid)}.joint-state.occluded{border-color:var(--ember);color:var(--ember)}.joint-state.ambiguous{border-color:var(--amber);color:var(--amber)}.joint-state.outside_frame{border-color:var(--violet);color:var(--violet)}
    .status-grid{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line)}.status-btn{min-height:43px;padding:5px;border:0;border-right:1px solid var(--line);background:#090c0d;color:var(--muted);cursor:pointer;font:800 8px/1.15 var(--mono)}.status-btn:last-child{border-right:0}.status-btn.active{background:var(--acid);color:var(--void)}.readout{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-top:8px;border:1px solid var(--line);background:var(--line)}.readout div{padding:7px;background:#090c0d}.readout span{display:block;color:var(--muted);font:7px/1 var(--mono)}.readout strong{display:block;margin-top:5px;font:800 9px/1 var(--mono)}.overclaim{margin-top:8px;padding:8px;border:1px solid #664034;color:var(--ember);font:8px/1.4 var(--mono)}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.field{display:grid;gap:5px;min-width:0}.field.full{grid-column:1/-1}.field label{color:var(--muted);font:700 7px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase}.field input,.field select{width:100%;min-width:0;height:30px;padding:0 6px}.field textarea{width:100%;min-height:64px;padding:7px;resize:vertical;line-height:1.4}.lineage{display:grid;gap:6px}.lineage-row{display:grid;grid-template-columns:76px 1fr;gap:7px;font:8px/1.35 var(--mono)}.lineage-row dt{color:var(--muted)}.lineage-row dd{margin:0;overflow-wrap:anywhere}.flash{min-height:31px;padding:8px;border:1px solid var(--line);color:var(--muted);font:8px/1.4 var(--mono)}.flash.ok{border-color:#56672e;color:var(--acid)}.flash.error{border-color:#6c3e32;color:var(--ember)}.actions{display:grid;grid-template-columns:1fr 1.4fr;gap:7px;margin-top:7px}.action{min-height:37px;border:1px solid var(--line);background:var(--raised);cursor:pointer;font:800 9px/1 var(--mono)}.action.primary{border-color:var(--acid);background:var(--acid);color:var(--void)}.action:disabled{opacity:.5;cursor:wait}.empty{padding:22px;color:var(--muted);font:9px/1.6 var(--mono)}
    @media(max-width:1180px){.workspace{grid-template-columns:255px minmax(430px,1fr) 330px}.headline-stats{grid-template-columns:repeat(3,94px)}.headline-stat:nth-child(n+4){display:none}}
  </style>

<body>
  <div class="shell">
    <header class="masthead"><div class="brand"><div class="brand-mark">PCK<br>.10</div><div><p class="eyebrow">Frozen human keypoint truth · Halpe-26</p><h1>正面卧推骨架真值台</h1><p class="subcopy">人工坐标 × 原始 RTMPose × Rust canonical · 三层独立验收</p></div><nav class="nav"><a href="/">识别审计</a><a href="/equipment.html">杠铃轴</a><a href="/dumbbell.html">哑铃框</a></nav></div><div class="headline-stats" id="headline-stats"></div></header>
    <main class="workspace">
      <aside class="rail"><section class="filters"><input class="search" id="search" placeholder="搜索 source / frame / stratum…"><p class="filter-label">Review state</p><div class="segmented" style="--cols:4" id="status-filter"><button class="filter-btn active" data-status="all">ALL</button><button class="filter-btn" data-status="unreviewed">OPEN</button><button class="filter-btn" data-status="draft">DRAFT</button><button class="filter-btn" data-status="submitted">DONE</button></div><div class="select-row"><select id="source-filter"><option value="all">全部来源</option></select><select id="stratum-filter"><option value="all">全部分层</option></select></div></section><section class="queue-summary"><div class="summary-line"><span>冻结测试真值进度</span><strong id="filter-progress">—</strong></div><div class="progress"><i id="progress-bar"></i></div></section><div class="queue" id="queue"></div></aside>
      <section class="viewer"><div class="stage" id="stage"><div class="stage-grid"></div><img class="stage-img" id="stage-img" alt="front bench frozen frame"><canvas class="pose-canvas" id="pose-canvas"></canvas><div class="stage-labels"><span class="chip violet" id="source-chip">FROZEN TEST</span><span class="chip" id="state-chip">UNREVIEWED</span></div><div class="loading" id="loading">LOADING FROZEN FRAME</div></div><div class="transport"><div class="transport-main"><button class="primary" id="prev">K · 上一帧</button><button class="primary" id="next">J · 下一帧</button><button class="layer raw active" data-layer="raw">RAW</button><button class="layer rust active" data-layer="rust">RUST</button><button class="layer human active" data-layer="human">HUMAN</button><span class="transport-note">拖动绿色人工点；青色/黄色模型点只读，不会变成人工真值</span><span class="shortcut"><b>⌘↵</b> 提交</span></div></div></section>
      <aside class="inspector" id="inspector"><div class="empty">正在载入 120 个冻结测试帧…</div></aside>
    </main>
  </div>
  <script>
    const STATUS_GLYPH={submitted:"✓",draft:"△",disagreement:"!",unreviewed:"○"},STATE_LABEL={visible:"V",occluded:"O",ambiguous:"?",outside_frame:"×"};
    const CONNECTIONS=[[5,6],[5,7],[7,9],[6,8],[8,10],[5,11],[6,12],[11,12]];
    const state={index:null,metrics:null,detail:null,selectedId:null,status:"all",source:"all",stratum:"all",search:"",joints:[],selectedJoint:5,note:"",layers:{raw:true,rust:true,human:true},pointer:null,saving:false,flash:"",flashKind:"",requestToken:0};
    const dom={};for(const id of ["headline-stats","search","status-filter","source-filter","stratum-filter","filter-progress","progress-bar","queue","stage","stage-img","pose-canvas","source-chip","state-chip","loading","prev","next","inspector"])dom[id]=document.getElementById(id);const canvas=dom["pose-canvas"],ctx=canvas.getContext("2d");boot().catch(fatal);
    async function boot(){const [indexResponse,metricsResponse]=await Promise.all([fetch("/api/review/pose-keypoint/index"),fetch("/api/review/pose-keypoint/metrics")]);if(!indexResponse.ok)throw new Error((await indexResponse.json()).error||"骨架真值队列加载失败");if(!metricsResponse.ok)throw new Error((await metricsResponse.json()).error||"骨架指标加载失败");state.index=await indexResponse.json();state.metrics=await metricsResponse.json();bind();renderHeader();renderOptions();renderQueue(true);new ResizeObserver(()=>{resizeCanvas();draw()}).observe(dom.stage)}
    function bind(){dom.search.addEventListener("input",e=>{state.search=e.target.value.trim().toLowerCase();renderQueue(true)});dom["status-filter"].addEventListener("click",e=>{const b=e.target.closest("[data-status]");if(!b)return;state.status=b.dataset.status;[...e.currentTarget.children].forEach(x=>x.classList.toggle("active",x===b));renderQueue(true)});dom["source-filter"].addEventListener("change",e=>{state.source=e.target.value;renderQueue(true)});dom["stratum-filter"].addEventListener("change",e=>{state.stratum=e.target.value;renderQueue(true)});dom.prev.addEventListener("click",()=>step(-1));dom.next.addEventListener("click",()=>step(1));document.querySelectorAll("[data-layer]").forEach(b=>b.addEventListener("click",()=>{state.layers[b.dataset.layer]=!state.layers[b.dataset.layer];b.classList.toggle("active",state.layers[b.dataset.layer]);draw()}));dom["stage-img"].addEventListener("load",()=>{dom.loading.hidden=true;resizeCanvas();draw()});canvas.addEventListener("pointerdown",pointerDown);canvas.addEventListener("pointermove",pointerMove);canvas.addEventListener("pointerup",pointerUp);canvas.addEventListener("pointercancel",pointerUp);document.addEventListener("keydown",shortcut)}
    function renderHeader(){const s=state.index.stats,pck=state.metrics?.metrics?.rustCanonical?.pckAtThreshold?.rate,pckValue=Number.isFinite(pck)?`${(pck*100).toFixed(1)}%`:"BLOCK",values=[[s.itemCount,"冻结帧",""] ,[s.sourceCaptureCount,"来源视频",""] ,[s.submittedItems,"人工提交","acid"],[s.unreviewedItems,"待复核",""] ,[pckValue,Number.isFinite(pck)?"RUST PCK@.10":"PCK 未测",state.metrics?.researchMetricPass?"acid":"alert"]];dom["headline-stats"].innerHTML=values.map(v=>`<div class="headline-stat ${v[2]}"><strong>${v[0]}</strong><span>${v[1]}</span></div>`).join("")}
    function renderOptions(){const sources=[...new Set(state.index.items.map(x=>x.sourceCaptureId))].sort(),strata=[...new Set(state.index.items.map(x=>x.selectionReason))].sort();dom["source-filter"].innerHTML=`<option value="all">全部来源</option>${sources.map(x=>`<option value="${x}">${x.slice(0,8)}</option>`).join("")}`;dom["stratum-filter"].innerHTML=`<option value="all">全部分层</option>${strata.map(x=>`<option value="${x}">${x}</option>`).join("")}`}
    function filtered(){return state.index.items.filter(x=>{if(state.status!=="all"&&x.status!==state.status)return false;if(state.source!=="all"&&x.sourceCaptureId!==state.source)return false;if(state.stratum!=="all"&&x.selectionReason!==state.stratum)return false;const text=`${x.sourceCaptureId} ${x.frameNumber} ${x.selectionReason} ${x.phaseContext?.phase||""}`.toLowerCase();return !state.search||text.includes(state.search)}).sort((a,b)=>a.sourceCaptureId.localeCompare(b.sourceCaptureId)||a.frameNumber-b.frameNumber)}
    function renderQueue(auto){const items=filtered(),done=items.filter(x=>x.status==="submitted").length;dom["filter-progress"].textContent=`${done} / ${items.length}`;dom["progress-bar"].style.width=`${items.length?done/items.length*100:0}%`;dom.queue.innerHTML=`<div class="queue-count">${items.length} FRAMES · TEST ONLY</div>`+(items.length?items.map(x=>`<button class="queue-card ${x.status} ${x.reviewItemId===state.selectedId?"active":""}" data-id="${x.reviewItemId}"><span class="queue-glyph">${STATUS_GLYPH[x.status]||"○"}</span><span><span class="queue-title">F${String(x.frameNumber).padStart(6,"0")} · ${x.phaseContext?.phase||"OUTSIDE REP"}</span><span class="queue-meta">${x.sourceCaptureId.slice(0,8)} · ${x.selectionReason}</span></span><span class="score">${Number(x.minimumRawScore).toFixed(2)}</span></button>`).join(""):`<div class="empty">当前筛选没有帧。</div>`);dom.queue.querySelectorAll("[data-id]").forEach(b=>b.addEventListener("click",()=>selectItem(b.dataset.id)));if(auto&&items.length&&!items.some(x=>x.reviewItemId===state.selectedId))selectItem(items[0].reviewItemId)}
    async function selectItem(id){const token=++state.requestToken;state.selectedId=id;state.detail=null;state.flash="";state.pointer=null;dom.loading.hidden=false;renderQueue(false);const r=await fetch(`/api/review/pose-keypoint/item?id=${encodeURIComponent(id)}`);if(!r.ok)throw new Error((await r.json()).error||"骨架真值帧加载失败");const detail=await r.json();if(token!==state.requestToken)return;state.detail=detail;const reviewerId=localStorage.getItem("maxpower.poseReviewerId")||"local-owner",latest=detail.latestByReviewer.find(e=>e.reviewerId===reviewerId)||null;state.joints=structuredClone(latest?.joints||initialJoints(detail));state.selectedJoint=state.joints[0]?.index||5;state.note=latest?.note||"";dom["stage-img"].src=`${detail.imageUrl}&v=${detail.item.imageSha256.slice(0,12)}`;dom["source-chip"].textContent=`FROZEN TEST · ${detail.item.sourceCaptureId.slice(0,8)} · ${detail.item.phaseContext?.phase||"OUTSIDE REP"}`;dom["state-chip"].textContent=(latest?.reviewStatus||"unreviewed").toUpperCase();dom["state-chip"].className=`chip ${latest?.reviewStatus==="submitted"?"acid":""}`;renderInspector();draw()}
    function initialJoints(detail){return detail.item.rawRtmpose.requiredJoints.map(point=>({index:point.index,name:point.name,status:Number.isFinite(point.x)&&Number.isFinite(point.y)?"visible":"ambiguous",x:Number.isFinite(point.x)?point.x:null,y:Number.isFinite(point.y)?point.y:null}))}
    function renderInspector(){if(!state.detail){dom.inspector.innerHTML=`<div class="empty">请选择冻结帧。</div>`;return}const item=state.detail.item,selected=joint(state.selectedJoint),raw=modelJoint("rawRtmpose",state.selectedJoint),rust=modelJoint("rustCanonical",state.selectedJoint),reviewerId=localStorage.getItem("maxpower.poseReviewerId")||"local-owner",role=localStorage.getItem("maxpower.poseReviewerRole")||"owner_observation",overclaim=selected?.status!=="visible"&&rust?.source==="measured"&&rust?.usable;dom.inspector.innerHTML=`<div class="inspector-head"><div class="case-number">FRAME ${String(item.frameNumber).padStart(6,"0")} · FROZEN TEST</div><h2 class="case-title">人工关键点真值</h2><p class="case-id">${item.reviewItemId}</p><div class="policy">绿色点才是人工真值。青色 RTMPose 与黄色 Rust canonical 只作盲标后的对照；遮挡/歧义点不得保留坐标，更不得反向生成“实测点”。</div></div>
      <section class="section"><p class="section-label">Required joints · 8</p><div class="joint-list">${state.joints.map(x=>`<button class="joint-card ${x.index===state.selectedJoint?"active":""}" data-joint="${x.index}"><span class="joint-num">${x.index}</span><span class="joint-name">${x.name.replaceAll("_"," ")}</span><span class="joint-state ${x.status}">${STATE_LABEL[x.status]}</span></button>`).join("")}</div></section>
      <section class="section"><p class="section-label">Selected · ${selected?.name||"—"} · 快捷键 1–4</p><div class="status-grid"><button class="status-btn ${selected?.status==="visible"?"active":""}" data-joint-status="visible">1<br>VISIBLE</button><button class="status-btn ${selected?.status==="occluded"?"active":""}" data-joint-status="occluded">2<br>OCCLUDED</button><button class="status-btn ${selected?.status==="ambiguous"?"active":""}" data-joint-status="ambiguous">3<br>AMBIGUOUS</button><button class="status-btn ${selected?.status==="outside_frame"?"active":""}" data-joint-status="outside_frame">4<br>OUTSIDE</button></div><div class="readout"><div><span>HUMAN</span><strong>${formatPoint(selected)}</strong></div><div><span>RAW · ${formatScore(raw)}</span><strong>${formatModel(raw)}</strong></div><div><span>RUST · ${rust?.source||"—"}</span><strong>${formatModel(rust)}</strong></div></div>${overclaim?`<div class="overclaim">当前人工状态与 Rust 的可靠 measured 声明冲突；提交后会进入 overclaim 误差分母。</div>`:""}</section>
      <section class="section"><p class="section-label">Reviewer & evidence</p><div class="form-grid"><div class="field"><label>Reviewer ID</label><input id="reviewer-id" maxlength="64" value="${escapeHtml(reviewerId)}"></div><div class="field"><label>Role</label><select id="reviewer-role"><option value="owner_observation" ${role==="owner_observation"?"selected":""}>Owner observation</option><option value="vision_annotator" ${role==="vision_annotator"?"selected":""}>Vision annotator</option><option value="vision_reviewer" ${role==="vision_reviewer"?"selected":""}>Vision reviewer</option></select></div><div class="field full"><label>证据说明</label><textarea id="review-note" maxlength="1000" placeholder="说明杠铃遮挡、镜中肢体、歧义或画外原因…">${escapeHtml(state.note)}</textarea></div></div></section>
      <section class="section"><p class="section-label">Frozen lineage</p><dl class="lineage"><div class="lineage-row"><dt>source</dt><dd>${item.sourceCaptureId}</dd></div><div class="lineage-row"><dt>stratum</dt><dd>${item.selectionReason}</dd></div><div class="lineage-row"><dt>timestamp</dt><dd>${Number(item.timestampMs).toFixed(1)} ms</dd></div><div class="lineage-row"><dt>image sha</dt><dd>${item.imageSha256}</dd></div><div class="lineage-row"><dt>queue sha</dt><dd>${state.detail.queueSha256}</dd></div></dl></section>
      <section class="section"><div class="flash ${state.flashKind}">${escapeHtml(state.flash||"未保存。提交前请逐点确认，初始化的模型候选不是人工真值。")}</div><div class="actions"><button class="action" id="reset-raw">R · 重置 RAW</button><button class="action" id="save-draft" ${state.saving?"disabled":""}>保存草稿</button><button class="action primary" id="submit-next" ${state.saving?"disabled":""}>提交并下一帧 ⌘↵</button></div></section>`;
      dom.inspector.querySelectorAll("[data-joint]").forEach(b=>b.addEventListener("click",()=>{state.selectedJoint=Number(b.dataset.joint);renderInspector();draw()}));dom.inspector.querySelectorAll("[data-joint-status]").forEach(b=>b.addEventListener("click",()=>setJointStatus(b.dataset.jointStatus)));document.getElementById("review-note").addEventListener("input",e=>state.note=e.target.value);document.getElementById("reviewer-id").addEventListener("change",e=>{if(e.target.value.trim())localStorage.setItem("maxpower.poseReviewerId",e.target.value.trim())});document.getElementById("reviewer-role").addEventListener("change",e=>localStorage.setItem("maxpower.poseReviewerRole",e.target.value));document.getElementById("reset-raw").addEventListener("click",resetRaw);document.getElementById("save-draft").addEventListener("click",()=>save("draft",false));document.getElementById("submit-next").addEventListener("click",()=>save("submitted",true))}
    function setJointStatus(status){const current=joint(state.selectedJoint);if(!current)return;if(status==="visible"&&(current.x===null||current.y===null)){const source=modelJoint("rawRtmpose",current.index)||modelJoint("rustCanonical",current.index);current.x=source?.x??.5;current.y=source?.y??.5}if(status!=="visible"){current.x=null;current.y=null}current.status=status;renderInspector();draw()}
    function resetRaw(){state.joints=initialJoints(state.detail);state.selectedJoint=state.joints[0].index;renderInspector();draw()}
    function joint(index){return state.joints.find(x=>x.index===index)}function modelJoint(layer,index){return state.detail?.item[layer].requiredJoints.find(x=>x.index===index)}
    async function save(reviewStatus,moveNext){if(!state.detail||state.saving)return;const reviewerId=document.getElementById("reviewer-id").value.trim(),reviewerRole=document.getElementById("reviewer-role").value,latest=state.detail.latestByReviewer.find(e=>e.reviewerId===reviewerId)||null;state.saving=true;state.flash="正在追加人工关键点事件…";state.flashKind="";renderInspector();try{const r=await fetch("/api/review/pose-keypoint",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({reviewItemId:state.detail.item.reviewItemId,reviewerId,reviewerRole,reviewStatus,expectedPriorEventId:latest?.eventId||null,joints:state.joints,note:state.note})});const body=await r.json();if(!r.ok)throw new Error(body.error||"保存失败");localStorage.setItem("maxpower.poseReviewerId",reviewerId);localStorage.setItem("maxpower.poseReviewerRole",reviewerRole);state.flash=`已追加 ${reviewStatus==="submitted"?"正式":"草稿"}事件 ${body.eventId}`;state.flashKind="ok";const [indexResponse,metricsResponse]=await Promise.all([fetch("/api/review/pose-keypoint/index"),fetch("/api/review/pose-keypoint/metrics")]);state.index=await indexResponse.json();state.metrics=await metricsResponse.json();renderHeader();renderQueue(false);if(moveNext){await step(1,true);return}await selectItem(state.selectedId)}catch(error){state.flash=error.message||String(error);state.flashKind="error"}finally{state.saving=false;renderInspector()}}
    async function step(direction,preferOpen=false){const items=filtered();if(!items.length)return;const index=items.findIndex(x=>x.reviewItemId===state.selectedId);for(let count=1;count<=items.length;count++){const candidate=items[(Math.max(index,0)+direction*count+items.length*2)%items.length];if(!preferOpen||candidate.status==="unreviewed"){await selectItem(candidate.reviewItemId);return}}}
    function resizeCanvas(){const rect=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}function imageRect(){const w=canvas.clientWidth,h=canvas.clientHeight,nw=dom["stage-img"].naturalWidth||1,nh=dom["stage-img"].naturalHeight||1,s=Math.min(w/nw,h/nh),iw=nw*s,ih=nh*s;return{x:(w-iw)/2,y:(h-ih)/2,w:iw,h:ih}}function screenPoint(point,rect=imageRect()){return{x:rect.x+point.x*rect.w,y:rect.y+point.y*rect.h}}function eventPoint(event){const bounds=canvas.getBoundingClientRect(),rect=imageRect(),sx=event.clientX-bounds.left,sy=event.clientY-bounds.top;return{x:clamp((sx-rect.x)/rect.w),y:clamp((sy-rect.y)/rect.h),sx,sy,rect}}
    function draw(){ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);if(!state.detail||!dom["stage-img"].complete)return;const rect=imageRect();if(state.layers.raw)drawSkeleton(state.detail.item.rawRtmpose.requiredJoints,rect,"#45dce8",true,"RAW");if(state.layers.rust)drawSkeleton(state.detail.item.rustCanonical.requiredJoints.filter(x=>x.renderable),rect,"#ffc454",true,"RUST");if(state.layers.human)drawSkeleton(state.joints.filter(x=>x.status==="visible"),rect,"#ceff3e",false,"HUMAN")}
    function drawSkeleton(points,rect,color,dashed,label){const map=new Map(points.filter(p=>Number.isFinite(p.x)&&Number.isFinite(p.y)).map(p=>[p.index,p]));ctx.save();ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=dashed?1.5:2.5;ctx.setLineDash(dashed?[6,5]:[]);for(const [a,b] of CONNECTIONS){if(!map.has(a)||!map.has(b))continue;const p=screenPoint(map.get(a),rect),q=screenPoint(map.get(b),rect);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke()}for(const point of map.values()){const p=screenPoint(point,rect),selected=!dashed&&point.index===state.selectedJoint;ctx.beginPath();ctx.arc(p.x,p.y,selected?8:dashed?4:6,0,Math.PI*2);ctx.fill();if(selected){ctx.fillStyle="#060708";ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();ctx.fillStyle=color}}const first=[...map.values()][0];if(first){const p=screenPoint(first,rect);ctx.font="800 8px SFMono-Regular,monospace";ctx.fillText(label,p.x+8,p.y-8)}ctx.restore()}
    function pointerDown(event){if(!state.layers.human)return;const p=eventPoint(event),visible=state.joints.filter(x=>x.status==="visible");let best=null;for(const point of visible){const s=screenPoint(point,p.rect),distance=Math.hypot(p.sx-s.x,p.sy-s.y);if(distance<18&&(!best||distance<best.distance))best={point,distance}}if(!best)return;state.selectedJoint=best.point.index;state.pointer={id:event.pointerId,index:best.point.index};canvas.setPointerCapture(event.pointerId);renderInspector();draw()}
    function pointerMove(event){if(!state.pointer||state.pointer.id!==event.pointerId)return;const p=eventPoint(event),current=joint(state.pointer.index);if(!current)return;current.x=p.x;current.y=p.y;draw()}
    function pointerUp(event){if(state.pointer?.id!==event.pointerId)return;state.pointer=null;renderInspector();draw()}
    function shortcut(event){const tag=event.target?.tagName?.toLowerCase();if(["input","textarea","select"].includes(tag))return;if((event.metaKey||event.ctrlKey)&&event.key==="Enter"){event.preventDefault();save("submitted",true);return}const key=event.key.toLowerCase();if(key==="j")step(1);else if(key==="k")step(-1);else if(key==="r")resetRaw();else if(/^[1-4]$/.test(event.key))setJointStatus(["visible","occluded","ambiguous","outside_frame"][Number(event.key)-1])}
    function formatPoint(p){return p?.status==="visible"?`${p.x.toFixed(3)}, ${p.y.toFixed(3)}`:(p?.status||"—").toUpperCase()}function formatModel(p){return Number.isFinite(p?.x)&&Number.isFinite(p?.y)?`${p.x.toFixed(3)}, ${p.y.toFixed(3)}`:"UNKNOWN"}function formatScore(p){return Number(p?.score||0).toFixed(2)}function clamp(v){return Math.max(0,Math.min(1,v))}function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c])}function fatal(error){dom.loading.hidden=true;dom.queue.innerHTML=`<div class="empty">${escapeHtml(error.message||error)}</div>`;dom.inspector.innerHTML=`<div class="empty">骨架真值台启动失败。请先物化冻结帧队列。</div>`}
  </script>
