<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dumbbell Truth Lab · MM-Fit 哑铃框标注</title>
  <style>
    :root {
      color-scheme: dark;
      --void:#060809; --panel:#0e1315; --raised:#161d20; --line:#2b3639;
      --paper:#edf2e8; --muted:#839093; --acid:#cfff3d; --cyan:#43dce8;
      --ember:#ff6648; --amber:#ffc456; --display:"Songti SC","STSong",Georgia,serif;
      --condensed:"DIN Condensed","Avenir Next Condensed","Arial Narrow",sans-serif;
      --mono:"SFMono-Regular",Menlo,Monaco,monospace;
    }
    *{box-sizing:border-box} html,body{margin:0;min-height:100%;background:var(--void);color:var(--paper)}
    body{overflow:hidden;font-family:var(--condensed)} button,input,select,textarea{font:inherit;color:inherit}
    button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--acid);outline-offset:2px}
    [hidden]{display:none!important}
    .shell{height:100vh;display:grid;grid-template-rows:76px minmax(0,1fr);overflow:hidden}
    .masthead{display:grid;grid-template-columns:minmax(440px,1fr) auto;border-bottom:1px solid var(--line);background:#090d0e}
    .brand{display:flex;align-items:center;gap:15px;min-width:0;padding:11px 19px}
    .brand-mark{width:50px;height:50px;display:grid;place-items:center;border:1px solid var(--cyan);color:var(--cyan);font:900 15px/1 var(--mono);transform:rotate(-2deg)}
    .eyebrow{margin:0 0 5px;color:var(--cyan);font:800 8px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase}
    h1{margin:0;font:600 27px/.95 var(--display);letter-spacing:-.03em}.subcopy{margin:6px 0 0;color:var(--muted);font:9px/1.2 var(--mono)}
    .nav{margin-left:auto;display:flex;gap:7px}.nav a{padding:8px 9px;border:1px solid var(--line);color:var(--muted);text-decoration:none;font:700 7px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase}.nav a:hover{border-color:var(--cyan);color:var(--cyan)}
    .headline-stats{display:grid;grid-template-columns:repeat(5,minmax(90px,1fr));border-left:1px solid var(--line)}
    .headline-stat{min-width:92px;padding:10px 13px;border-left:1px solid var(--line);display:grid;align-content:center}.headline-stat:first-child{border-left:0}.headline-stat strong{font:900 19px/1 var(--mono);letter-spacing:-.06em}.headline-stat span{margin-top:6px;color:var(--muted);font:700 7px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase}.headline-stat.acid strong{color:var(--acid)}.headline-stat.alert strong{color:var(--ember)}
    .workspace{min-height:0;display:grid;grid-template-columns:306px minmax(500px,1fr) 375px;overflow:hidden}
    .rail,.inspector{min-height:0;background:var(--panel)}.rail{display:grid;grid-template-rows:auto auto minmax(0,1fr);border-right:1px solid var(--line)}.inspector{border-left:1px solid var(--line);overflow-y:auto}.viewer{min-width:0;min-height:0;display:grid;grid-template-rows:minmax(360px,1fr) auto;background:#030506}
    .filters{padding:12px;border-bottom:1px solid var(--line)}.search{width:100%;height:34px;padding:0 9px;border:1px solid var(--line);border-radius:0;background:#070a0b}.filter-label{margin:11px 0 6px;color:var(--muted);font:700 7px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase}.segmented{display:grid;grid-template-columns:repeat(var(--cols,4),1fr);border:1px solid var(--line)}.filter-btn{min-height:28px;padding:0 4px;border:0;border-right:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;font:700 7px/1 var(--mono)}.filter-btn:last-child{border-right:0}.filter-btn.active{background:var(--acid);color:var(--void)}
    .select-row{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}select,input,textarea{border-radius:0;border:1px solid var(--line);background:#080c0d}select{min-width:0;height:31px;padding:0 6px;font-size:9px}
    .queue-summary{padding:11px 12px;border-bottom:1px solid var(--line);background:#13191b}.summary-line{display:flex;justify-content:space-between;color:var(--muted);font:8px/1.4 var(--mono)}.summary-line strong{color:var(--paper)}.progress{height:3px;margin-top:8px;background:#2c3436}.progress i{display:block;height:100%;width:0;background:var(--acid);transition:width .2s}
    .queue{min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}.queue-count{position:sticky;top:0;z-index:3;padding:8px 11px;border-bottom:1px solid #252c2e;background:var(--panel);color:var(--muted);font:700 7px/1 var(--mono);letter-spacing:.08em}.queue-card{--status:var(--line);width:100%;display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px 10px;border:0;border-bottom:1px solid #242b2d;background:transparent;text-align:left;cursor:pointer}.queue-card:hover{background:#171e20}.queue-card.active{background:var(--acid);color:var(--void)}.queue-card.submitted{--status:var(--acid)}.queue-card.draft{--status:var(--amber)}.queue-card.disagreement{--status:var(--ember)}.queue-glyph{width:27px;height:27px;display:grid;place-items:center;border:1px solid var(--status);color:var(--status);font:800 9px/1 var(--mono)}.queue-card.active .queue-glyph{border-color:#65752d;color:var(--void)}.queue-title{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font:700 10px/1.1 var(--mono)}.queue-meta{display:block;margin-top:5px;color:var(--muted);font:700 7px/1 var(--mono);text-transform:uppercase}.queue-card.active .queue-meta{color:#59653a}.queue-split{padding:4px;border:1px solid var(--line);color:var(--muted);font:700 7px/1 var(--mono)}.queue-card.active .queue-split{border-color:#68753f;color:#394410}
    .stage{position:relative;min-height:0;overflow:hidden;background:radial-gradient(circle at 50% 45%,#162023 0,#050708 67%);touch-action:none}.stage::after{content:"";position:absolute;inset:17px;z-index:4;pointer-events:none;border:1px solid rgba(67,220,232,.12)}.stage-img,.box-canvas{position:absolute;inset:0;width:100%;height:100%}.stage-img{object-fit:contain;user-select:none;-webkit-user-drag:none}.box-canvas{z-index:3;cursor:crosshair}.stage-grid{position:absolute;inset:17px;z-index:1;pointer-events:none;opacity:.12;background-image:linear-gradient(rgba(67,220,232,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(67,220,232,.18) 1px,transparent 1px);background-size:10% 10%}.stage-labels{position:absolute;z-index:5;left:28px;top:28px;right:28px;display:flex;justify-content:space-between;pointer-events:none}.chip{display:inline-flex;min-height:24px;align-items:center;padding:0 7px;border:1px solid var(--line);background:rgba(6,8,9,.84);color:var(--muted);font:800 7px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase}.chip.cyan{border-color:var(--cyan);color:var(--cyan)}.chip.acid{border-color:var(--acid);color:var(--acid)}.chip.alert{border-color:var(--ember);color:var(--ember)}.loading{position:absolute;inset:0;z-index:9;display:grid;place-content:center;background:#070a0b;color:var(--cyan);font:800 9px/1 var(--mono);letter-spacing:.15em}
    .transport{padding:11px 15px;border-top:1px solid var(--line);background:#0c1112}.transport-main{display:grid;grid-template-columns:auto auto auto 1fr auto;gap:7px;align-items:center}.transport button{min-height:31px;padding:0 10px;border:1px solid var(--line);background:var(--raised);cursor:pointer;font:800 8px/1 var(--mono)}.transport button.primary{border-color:var(--cyan);color:var(--cyan)}.transport button.danger{border-color:#58372f;color:var(--ember)}.transport-note{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--muted);font:8px/1.3 var(--mono)}.shortcut{font:700 8px/1.4 var(--mono)}.shortcut b{color:var(--acid)}
    .inspector-head{position:relative;padding:16px;border-bottom:1px solid var(--line)}.inspector-head::before{content:"";position:absolute;left:0;top:0;width:5px;height:42px;background:var(--cyan)}.case-number{color:var(--muted);font:800 8px/1 var(--mono);letter-spacing:.1em}.case-title{margin:8px 0 0;font:600 23px/1 var(--display)}.case-id{margin:7px 0 0;color:var(--muted);overflow-wrap:anywhere;font:8px/1.4 var(--mono)}.policy{margin-top:11px;padding:9px;border-left:2px solid var(--amber);background:#19160d;color:#d6c579;font:8px/1.45 var(--mono)}
    .section{padding:13px 16px;border-bottom:1px solid var(--line)}.section-label{margin:0 0 9px;color:var(--muted);font:800 7px/1 var(--mono);letter-spacing:.13em;text-transform:uppercase}.target-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}.target-btn{min-height:38px;padding:7px;border:1px solid var(--line);background:#0a0e0f;color:#b0b9ba;cursor:pointer;text-align:left;font-size:9px}.target-btn:first-child{grid-column:1/-1}.target-btn.active{border-color:var(--acid);background:#18200e;color:var(--acid)}.target-btn.danger.active{border-color:var(--ember);background:#21130f;color:var(--ember)}.target-btn small{display:block;margin-top:3px;color:var(--muted);font:7px/1 var(--mono)}
    .instances{display:grid;gap:6px}.instance-card{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:7px;align-items:center;padding:8px;border:1px solid var(--line);background:#090d0e;cursor:pointer}.instance-card.active{border-color:var(--acid);background:#141b0e}.instance-num{width:26px;height:26px;display:grid;place-items:center;background:var(--acid);color:var(--void);font:900 9px/1 var(--mono)}.instance-box{font:8px/1.45 var(--mono)}.instance-box small{display:block;color:var(--muted)}.instance-delete{width:25px;height:25px;border:1px solid #57352e;background:transparent;color:var(--ember);cursor:pointer}.empty-instance{padding:12px;border:1px dashed var(--line);color:var(--muted);font:8px/1.45 var(--mono)}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.field{display:grid;gap:5px;min-width:0}.field.full{grid-column:1/-1}.field label{color:var(--muted);font:700 7px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase}.field input,.field select{width:100%;min-width:0;height:30px;padding:0 6px}.field textarea{width:100%;min-height:64px;padding:7px;resize:vertical;line-height:1.4}.checkbox{display:flex;align-items:center;gap:6px;min-height:30px;padding:0 7px;border:1px solid var(--line);background:#080c0d;color:#b2babb;font-size:8px}.checkbox input{width:auto;height:auto;accent-color:var(--acid)}
    .lineage{display:grid;gap:6px}.lineage-row{display:grid;grid-template-columns:78px 1fr;gap:7px;font:8px/1.35 var(--mono)}.lineage-row dt{color:var(--muted)}.lineage-row dd{margin:0;overflow-wrap:anywhere}.flash{min-height:31px;padding:8px;border:1px solid var(--line);color:var(--muted);font:8px/1.4 var(--mono)}.flash.ok{border-color:#56682d;color:var(--acid)}.flash.error{border-color:#6e3d31;color:var(--ember)}.actions{display:grid;grid-template-columns:1fr 1.4fr;gap:7px;margin-top:7px}.action{min-height:37px;border:1px solid var(--line);background:var(--raised);cursor:pointer;font:800 9px/1 var(--mono)}.action.primary{border-color:var(--acid);background:var(--acid);color:var(--void)}.action:disabled{opacity:.5;cursor:wait}.empty{padding:22px;color:var(--muted);font:9px/1.6 var(--mono)}
    @media(max-width:1180px){.workspace{grid-template-columns:260px minmax(420px,1fr) 330px}.headline-stats{grid-template-columns:repeat(3,95px)}.headline-stat:nth-child(n+4){display:none}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <div class="brand"><div class="brand-mark">DB×N</div><div><p class="eyebrow">MM-Fit · human equipment truth</p><h1>哑铃实例框标注台</h1><p class="subcopy">腕部候选只作定位提示 · 多框人工真值 · 受试者隔离验收</p></div><nav class="nav"><a href="/">识别审计</a><a href="/equipment.html">杠铃轴</a></nav></div>
      <div class="headline-stats" id="headline-stats"></div>
    </header>
    <main class="workspace">
      <aside class="rail">
        <section class="filters">
          <input class="search" id="search" placeholder="搜索动作 / subject / frame…">
          <p class="filter-label">Dataset split</p><div class="segmented" style="--cols:4" id="split-filter"><button class="filter-btn active" data-split="all">ALL</button><button class="filter-btn" data-split="train">TRAIN</button><button class="filter-btn" data-split="validation">VAL</button><button class="filter-btn" data-split="test">TEST</button></div>
          <p class="filter-label">Review state</p><div class="segmented" style="--cols:4" id="status-filter"><button class="filter-btn active" data-status="all">ALL</button><button class="filter-btn" data-status="unreviewed">OPEN</button><button class="filter-btn" data-status="draft">DRAFT</button><button class="filter-btn" data-status="submitted">DONE</button></div>
          <div class="select-row"><select id="subject-filter"><option value="all">全部受试者</option></select><select id="action-filter"><option value="all">全部动作</option></select></div>
        </section>
        <section class="queue-summary"><div class="summary-line"><span>当前筛选进度</span><strong id="filter-progress">—</strong></div><div class="progress"><i id="progress-bar"></i></div></section>
        <div class="queue" id="queue"></div>
      </aside>
      <section class="viewer">
        <div class="stage" id="stage"><div class="stage-grid"></div><img class="stage-img" id="stage-img" alt="MM-Fit frozen review frame"><canvas class="box-canvas" id="box-canvas"></canvas><div class="stage-labels"><span class="chip cyan" id="source-chip">MM-FIT TRAIN SOURCE</span><span class="chip" id="state-chip">UNREVIEWED</span></div><div class="loading" id="loading">LOADING FROZEN FRAME</div></div>
        <div class="transport"><div class="transport-main"><button class="primary" id="prev">K · 上一帧</button><button class="primary" id="next">J · 下一帧</button><button id="add-box">A · 新增框</button><button class="transport-note">拖空白处新建 · 拖框移动 · 拖四角缩放 · 青色虚线不是人工真值</button><span class="shortcut"><b>⌘↵</b> 提交</span></div></div>
      </section>
      <aside class="inspector" id="inspector"><div class="empty">正在载入 1,036 个冻结帧…</div></aside>
    </main>
  </div>
  <script>
    const TARGETS={visible_dumbbells:["目标哑铃可见","绘制 1–4 个真实哑铃框","1"],no_target_dumbbell:["没有目标哑铃","动作帧中不存在目标哑铃","2"],reflection_only:["仅镜像哑铃","只在镜中可见，不是前景器械","3"],static_rack_only:["仅静态器械架","背景哑铃/器械，不随主体运动","4"],ambiguous:["无法确认","遮挡或画质不足，需说明","5"]};
    const STATUS_GLYPH={submitted:"✓",draft:"△",disagreement:"!",unreviewed:"○"};
    const state={index:null,detail:null,selectedId:null,split:"all",status:"all",subject:"all",action:"all",search:"",target:"visible_dumbbells",instances:[],selectedInstanceId:null,note:"",pointer:null,requestToken:0,saving:false,flash:"",flashKind:""};
    const dom={}; for(const id of ["headline-stats","search","split-filter","status-filter","subject-filter","action-filter","filter-progress","progress-bar","queue","stage","stage-img","box-canvas","source-chip","state-chip","loading","prev","next","add-box","inspector"])dom[id]=document.getElementById(id);
    const canvas=dom["box-canvas"],ctx=canvas.getContext("2d");
    boot().catch(fatal);

    async function boot(){const response=await fetch("/api/review/dumbbell/index");if(!response.ok)throw new Error((await response.json()).error||"队列加载失败");state.index=await response.json();bind();renderHeader();renderOptions();renderQueue(true);new ResizeObserver(()=>{resizeCanvas();draw()}).observe(dom.stage);}
    function bind(){dom.search.addEventListener("input",e=>{state.search=e.target.value.trim().toLowerCase();renderQueue(true)});dom["split-filter"].addEventListener("click",e=>filterClick(e,"split"));dom["status-filter"].addEventListener("click",e=>filterClick(e,"status"));dom["subject-filter"].addEventListener("change",e=>{state.subject=e.target.value;renderQueue(true)});dom["action-filter"].addEventListener("change",e=>{state.action=e.target.value;renderQueue(true)});dom.prev.addEventListener("click",()=>step(-1));dom.next.addEventListener("click",()=>step(1));dom["add-box"].addEventListener("click",addBox);dom["stage-img"].addEventListener("load",()=>{dom.loading.hidden=true;resizeCanvas();draw()});canvas.addEventListener("pointerdown",pointerDown);canvas.addEventListener("pointermove",pointerMove);canvas.addEventListener("pointerup",pointerUp);canvas.addEventListener("pointercancel",pointerUp);document.addEventListener("keydown",shortcut);}
    function filterClick(event,key){const button=event.target.closest(`[data-${key}]`);if(!button)return;state[key]=button.dataset[key];[...event.currentTarget.children].forEach(child=>child.classList.toggle("active",child===button));renderQueue(true)}
    function renderHeader(){const s=state.index.stats;const values=[[s.itemCount,"冻结帧"],[s.submittedItems,"人工提交"],[s.unreviewedItems,"待标注"],[s.dumbbellActionItems,"哑铃候选"],["BLOCK","禁止发布"]];dom["headline-stats"].innerHTML=values.map((v,i)=>`<div class="headline-stat ${i===1?"acid":i===4?"alert":""}"><strong>${v[0]}</strong><span>${v[1]}</span></div>`).join("")}
    function renderOptions(){const subjects=[...new Set(state.index.items.map(x=>x.subjectId))].sort();const actions=[...new Set(state.index.items.map(x=>x.sourceAction))].sort();dom["subject-filter"].innerHTML=`<option value="all">全部受试者</option>${subjects.map(v=>`<option value="${escapeHtml(v)}">SUBJECT ${escapeHtml(v)}</option>`).join("")}`;dom["action-filter"].innerHTML=`<option value="all">全部动作</option>${actions.map(v=>`<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join("")}`}
    function filteredItems(){return state.index.items.filter(item=>{if(state.split!=="all"&&item.split!==state.split)return false;if(state.status!=="all"&&item.status!==state.status)return false;if(state.subject!=="all"&&item.subjectId!==state.subject)return false;if(state.action!=="all"&&item.sourceAction!==state.action)return false;const text=`${item.sourceAction} ${item.exerciseId} ${item.subjectId} ${item.sessionId} ${item.frameIndex} ${item.sampleKind}`.toLowerCase();return !state.search||text.includes(state.search)}).sort((a,b)=>a.subjectId.localeCompare(b.subjectId)||a.sourceSequenceId.localeCompare(b.sourceSequenceId)||a.frameIndex-b.frameIndex)}
    function renderQueue(autoSelect){const items=filteredItems();const submitted=items.filter(x=>x.status==="submitted").length;dom["filter-progress"].textContent=`${submitted} / ${items.length}`;dom["progress-bar"].style.width=`${items.length?submitted/items.length*100:0}%`;dom.queue.innerHTML=`<div class="queue-count">${items.length} FRAMES · SUBJECT-DISJOINT</div>`+(items.length?items.map(item=>`<button class="queue-card ${item.status} ${item.reviewItemId===state.selectedId?"active":""}" data-id="${escapeHtml(item.reviewItemId)}"><span class="queue-glyph">${STATUS_GLYPH[item.status]||"○"}</span><span><span class="queue-title">${escapeHtml(item.sourceAction)}</span><span class="queue-meta">W${escapeHtml(item.subjectId)} · F${String(item.frameIndex).padStart(6,"0")} · ${item.proposalCount?`${item.proposalCount} ROI`:"NEGATIVE"}</span></span><span class="queue-split">${item.split==="validation"?"VAL":item.split}</span></button>`).join(""):`<div class="empty">当前筛选没有帧。</div>`);dom.queue.querySelectorAll("[data-id]").forEach(button=>button.addEventListener("click",()=>selectItem(button.dataset.id)));if(autoSelect&&items.length&&!items.some(x=>x.reviewItemId===state.selectedId))selectItem(items[0].reviewItemId)}
    async function selectItem(id){const token=++state.requestToken;state.selectedId=id;state.detail=null;state.flash="";state.pointer=null;dom.loading.hidden=false;renderQueue(false);const response=await fetch(`/api/review/dumbbell/item?id=${encodeURIComponent(id)}`);if(!response.ok)throw new Error((await response.json()).error||"复核项加载失败");const detail=await response.json();if(token!==state.requestToken)return;state.detail=detail;const reviewerId=localStorage.getItem("maxpower.dumbbellReviewerId")||"local-owner";const latest=detail.latestByReviewer.find(e=>e.reviewerId===reviewerId)||null;state.target=latest?.target||(detail.item.proposal.instances.length?"visible_dumbbells":"no_target_dumbbell");state.instances=structuredClone(latest?.instances||(state.target==="visible_dumbbells"?proposalInstances(detail):[]));state.selectedInstanceId=state.instances[0]?.instanceId||null;state.note=latest?.note||"";dom["stage-img"].src=`${detail.imageUrl}&v=${detail.item.imageSha256.slice(0,12)}`;dom["source-chip"].textContent=`MM-FIT OFFICIAL TRAIN · INNER ${detail.item.split.toUpperCase()}`;dom["state-chip"].textContent=(latest?.reviewStatus||"unreviewed").toUpperCase();dom["state-chip"].className=`chip ${latest?.reviewStatus==="submitted"?"acid":""}`;renderInspector();draw()}
    function proposalInstances(detail){return detail.item.proposal.instances.slice(0,4).map((x,i)=>({instanceId:`dumbbell-${i+1}`,bbox:structuredClone(x.bbox),imageSide:x.hand==="left"?"image_left":"image_right",occlusion:"unknown",truncated:false}))}
    function renderInspector(){if(!state.detail){dom.inspector.innerHTML=`<div class="empty">请选择冻结帧。</div>`;return}const item=state.detail.item,reviewerId=localStorage.getItem("maxpower.dumbbellReviewerId")||"local-owner",reviewerRole=localStorage.getItem("maxpower.dumbbellReviewerRole")||"owner_observation",selected=state.instances.find(x=>x.instanceId===state.selectedInstanceId)||null;dom.inspector.innerHTML=`<div class="inspector-head"><div class="case-number">W${escapeHtml(item.subjectId)} · FRAME ${String(item.frameIndex).padStart(6,"0")} · ${item.split.toUpperCase()}</div><h2 class="case-title">哑铃实例人工真值</h2><p class="case-id">${escapeHtml(item.reviewItemId)}</p><div class="policy">青色虚线来自手腕 ROI，只能帮助定位。只有绿色人工框可进入训练；TEST 是内部冻结留出集，只能在模型与阈值冻结后评分。</div></div>
      <section class="section"><p class="section-label">Target classification · 快捷键 1–5</p><div class="target-grid">${Object.entries(TARGETS).map(([key,v])=>`<button class="target-btn ${key!=="visible_dumbbells"?"danger":""} ${state.target===key?"active":""}" data-target="${key}">${v[0]}<small>${v[2]} · ${v[1]}</small></button>`).join("")}</div></section>
      <section class="section"><p class="section-label">Human boxes · ${state.instances.length}/4</p><div class="instances">${state.instances.length?state.instances.map((x,i)=>`<div class="instance-card ${x.instanceId===state.selectedInstanceId?"active":""}" data-instance="${escapeHtml(x.instanceId)}"><span class="instance-num">${i+1}</span><span class="instance-box">${escapeHtml(x.imageSide)} · ${escapeHtml(x.occlusion)}<small>${formatBox(x.bbox)}</small></span><button class="instance-delete" data-delete="${escapeHtml(x.instanceId)}">×</button></div>`).join(""):`<div class="empty-instance">没有人工框。选择“目标哑铃可见”后，在图片空白处拖动新建，或按 A。</div>`}</div></section>
      ${selected?`<section class="section"><p class="section-label">Selected instance</p><div class="form-grid"><div class="field"><label>画面侧</label><select id="image-side"><option value="image_left" ${selected.imageSide==="image_left"?"selected":""}>画面左</option><option value="image_right" ${selected.imageSide==="image_right"?"selected":""}>画面右</option><option value="unknown" ${selected.imageSide==="unknown"?"selected":""}>未知</option></select></div><div class="field"><label>遮挡</label><select id="occlusion"><option value="none" ${selected.occlusion==="none"?"selected":""}>无遮挡</option><option value="partial" ${selected.occlusion==="partial"?"selected":""}>部分遮挡</option><option value="heavy" ${selected.occlusion==="heavy"?"selected":""}>重度遮挡</option><option value="unknown" ${selected.occlusion==="unknown"?"selected":""}>未知</option></select></div><div class="field full"><label class="checkbox"><input id="truncated" type="checkbox" ${selected.truncated?"checked":""}> 器械被画面边缘截断</label></div></div></section>`:""}
      <section class="section"><p class="section-label">Reviewer & evidence</p><div class="form-grid"><div class="field"><label>Reviewer ID</label><input id="reviewer-id" maxlength="64" value="${escapeHtml(reviewerId)}"></div><div class="field"><label>Role</label><select id="reviewer-role"><option value="owner_observation" ${reviewerRole==="owner_observation"?"selected":""}>Owner observation</option><option value="vision_annotator" ${reviewerRole==="vision_annotator"?"selected":""}>Vision annotator</option><option value="vision_reviewer" ${reviewerRole==="vision_reviewer"?"selected":""}>Vision reviewer</option></select></div><div class="field full"><label>证据说明</label><textarea id="review-note" maxlength="1000" placeholder="镜面、遮挡、静态架位或无法确认的原因…">${escapeHtml(state.note)}</textarea></div></div></section>
      <section class="section"><p class="section-label">Frozen lineage</p><dl class="lineage"><div class="lineage-row"><dt>sequence</dt><dd>${escapeHtml(item.sourceSequenceId)}</dd></div><div class="lineage-row"><dt>action</dt><dd>${escapeHtml(item.sourceAction)} → ${escapeHtml(item.exerciseId)}</dd></div><div class="lineage-row"><dt>image sha</dt><dd>${item.imageSha256}</dd></div><div class="lineage-row"><dt>queue sha</dt><dd>${state.detail.queueSha256}</dd></div><div class="lineage-row"><dt>proposal</dt><dd>${escapeHtml(item.proposal.source)} · humanTruth=false</dd></div></dl></section>
      <section class="section"><div class="flash ${state.flashKind}">${escapeHtml(state.flash||"未保存。草稿与提交均追加新事件，不覆盖历史。")}</div><div class="actions"><button class="action" id="save-draft" ${state.saving?"disabled":""}>保存草稿</button><button class="action primary" id="submit-next" ${state.saving?"disabled":""}>提交并下一帧 ⌘↵</button></div></section>`;
      dom.inspector.querySelectorAll("[data-target]").forEach(b=>b.addEventListener("click",()=>setTarget(b.dataset.target)));dom.inspector.querySelectorAll("[data-instance]").forEach(card=>card.addEventListener("click",e=>{if(e.target.closest("[data-delete]"))return;state.selectedInstanceId=card.dataset.instance;renderInspector();draw()}));dom.inspector.querySelectorAll("[data-delete]").forEach(b=>b.addEventListener("click",()=>deleteBox(b.dataset.delete)));const side=document.getElementById("image-side"),occ=document.getElementById("occlusion"),trunc=document.getElementById("truncated");if(side)side.addEventListener("change",e=>updateSelected({imageSide:e.target.value}));if(occ)occ.addEventListener("change",e=>updateSelected({occlusion:e.target.value}));if(trunc)trunc.addEventListener("change",e=>updateSelected({truncated:e.target.checked}));document.getElementById("review-note").addEventListener("input",e=>state.note=e.target.value);document.getElementById("reviewer-id").addEventListener("change",e=>{if(e.target.value.trim())localStorage.setItem("maxpower.dumbbellReviewerId",e.target.value.trim())});document.getElementById("reviewer-role").addEventListener("change",e=>localStorage.setItem("maxpower.dumbbellReviewerRole",e.target.value));document.getElementById("save-draft").addEventListener("click",()=>save("draft",false));document.getElementById("submit-next").addEventListener("click",()=>save("submitted",true));}
    function setTarget(target){state.target=target;if(target!=="visible_dumbbells"){state.instances=[];state.selectedInstanceId=null}else if(!state.instances.length)resetProposals();renderInspector();draw()}
    function resetProposals(){if(!state.detail)return;state.target="visible_dumbbells";state.instances=proposalInstances(state.detail);if(!state.instances.length)state.instances=[newInstance({x1:.4,y1:.42,x2:.6,y2:.58})];state.selectedInstanceId=state.instances[0]?.instanceId||null;renderInspector();draw()}
    function addBox(){if(!state.detail)return;if(state.instances.length>=4){state.flash="每帧最多 4 个目标哑铃框。";state.flashKind="error";renderInspector();return}state.target="visible_dumbbells";const offset=.03*state.instances.length,box=newInstance({x1:.39+offset,y1:.39+offset,x2:.61+offset,y2:.61+offset});state.instances.push(box);state.selectedInstanceId=box.instanceId;renderInspector();draw()}
    function newInstance(bbox){let n=1;while(state.instances.some(x=>x.instanceId===`dumbbell-${n}`))n++;return{instanceId:`dumbbell-${n}`,bbox,imageSide:"unknown",occlusion:"unknown",truncated:false}}
    function deleteBox(id){state.instances=state.instances.filter(x=>x.instanceId!==id);state.selectedInstanceId=state.instances[0]?.instanceId||null;renderInspector();draw()}
    function updateSelected(change){state.instances=state.instances.map(x=>x.instanceId===state.selectedInstanceId?{...x,...change}:x);renderInspector();draw()}
    async function save(reviewStatus,moveNext){if(!state.detail||state.saving)return;const reviewerId=document.getElementById("reviewer-id").value.trim(),reviewerRole=document.getElementById("reviewer-role").value,latest=state.detail.latestByReviewer.find(e=>e.reviewerId===reviewerId)||null;state.saving=true;state.flash="正在追加人工事件…";state.flashKind="";renderInspector();try{const response=await fetch("/api/review/dumbbell",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({reviewItemId:state.detail.item.reviewItemId,reviewerId,reviewerRole,reviewStatus,expectedPriorEventId:latest?.eventId||null,target:state.target,instances:state.target==="visible_dumbbells"?state.instances:[],note:state.note})});const body=await response.json();if(!response.ok)throw new Error(body.error||"保存失败");localStorage.setItem("maxpower.dumbbellReviewerId",reviewerId);localStorage.setItem("maxpower.dumbbellReviewerRole",reviewerRole);state.flash=`已追加 ${reviewStatus==="submitted"?"正式":"草稿"}事件 ${body.eventId}`;state.flashKind="ok";const r=await fetch("/api/review/dumbbell/index");state.index=await r.json();renderHeader();renderQueue(false);if(moveNext){await step(1,true);return}await selectItem(state.selectedId)}catch(error){state.flash=error.message||String(error);state.flashKind="error"}finally{state.saving=false;renderInspector()}}
    async function step(direction,preferUnreviewed=false){const items=filteredItems();if(!items.length)return;const index=items.findIndex(x=>x.reviewItemId===state.selectedId);for(let count=1;count<=items.length;count++){const candidate=items[(Math.max(index,0)+direction*count+items.length*2)%items.length];if(!preferUnreviewed||candidate.status==="unreviewed"){await selectItem(candidate.reviewItemId);return}}}
    function resizeCanvas(){const rect=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
    function imageRect(){const width=canvas.clientWidth,height=canvas.clientHeight,nw=dom["stage-img"].naturalWidth||1,nh=dom["stage-img"].naturalHeight||1,scale=Math.min(width/nw,height/nh),w=nw*scale,h=nh*scale;return{x:(width-w)/2,y:(height-h)/2,w,h}}
    function screenBox(box,rect=imageRect()){return{x:rect.x+box.x1*rect.w,y:rect.y+box.y1*rect.h,w:(box.x2-box.x1)*rect.w,h:(box.y2-box.y1)*rect.h}}
    function point(event){const bounds=canvas.getBoundingClientRect(),rect=imageRect(),sx=event.clientX-bounds.left,sy=event.clientY-bounds.top;return{x:clamp((sx-rect.x)/rect.w),y:clamp((sy-rect.y)/rect.h),sx,sy,rect}}
    function draw(){ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);if(!state.detail||!dom["stage-img"].complete)return;const rect=imageRect();for(const [i,p] of state.detail.item.proposal.instances.entries())drawBox(p.bbox,rect,"#43dce8",true,`ROI ${i+1}`);if(state.target==="visible_dumbbells")for(const [i,x] of state.instances.entries())drawBox(x.bbox,rect,x.instanceId===state.selectedInstanceId?"#cfff3d":"#edf2e8",false,`DB ${i+1}`,x.instanceId===state.selectedInstanceId);else{ctx.save();ctx.fillStyle=state.target==="ambiguous"?"#ffc456":"#ff6648";ctx.font="900 13px SFMono-Regular,monospace";ctx.textAlign="center";ctx.fillText((TARGETS[state.target]?.[0]||state.target).toUpperCase(),rect.x+rect.w/2,rect.y+rect.h/2);ctx.restore()}}
    function drawBox(box,rect,color,dashed,label,handles=false){const b=screenBox(box,rect);ctx.save();ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=dashed?2:3;ctx.setLineDash(dashed?[7,5]:[]);ctx.strokeRect(b.x,b.y,b.w,b.h);ctx.font="800 9px SFMono-Regular,monospace";ctx.fillText(label,b.x+3,Math.max(rect.y+11,b.y-6));if(handles)for(const [x,y] of [[b.x,b.y],[b.x+b.w,b.y],[b.x,b.y+b.h],[b.x+b.w,b.y+b.h]]){ctx.fillRect(x-5,y-5,10,10);ctx.fillStyle="#060809";ctx.fillRect(x-2,y-2,4,4);ctx.fillStyle=color}ctx.restore()}
    function pointerDown(event){if(!state.detail||state.target!=="visible_dumbbells")return;const p=point(event),hit=hitTest(p);if(hit){state.selectedInstanceId=hit.instance.instanceId;state.pointer={id:event.pointerId,mode:hit.mode,start:p,box:structuredClone(hit.instance.bbox),instanceId:hit.instance.instanceId}}else if(state.instances.length<4){const instance=newInstance({x1:p.x,y1:p.y,x2:Math.min(1,p.x+.011),y2:Math.min(1,p.y+.011)});state.instances.push(instance);state.selectedInstanceId=instance.instanceId;state.pointer={id:event.pointerId,mode:"draw",start:p,box:structuredClone(instance.bbox),instanceId:instance.instanceId}}canvas.setPointerCapture(event.pointerId);renderInspector();draw()}
    function hitTest(p){for(const instance of [...state.instances].reverse()){const b=screenBox(instance.bbox,p.rect),corners={nw:[b.x,b.y],ne:[b.x+b.w,b.y],sw:[b.x,b.y+b.h],se:[b.x+b.w,b.y+b.h]};for(const [mode,[x,y]] of Object.entries(corners))if(Math.hypot(p.sx-x,p.sy-y)<15)return{instance,mode};if(p.sx>=b.x&&p.sx<=b.x+b.w&&p.sy>=b.y&&p.sy<=b.y+b.h)return{instance,mode:"move"}}return null}
    function pointerMove(event){if(!state.pointer||state.pointer.id!==event.pointerId)return;const p=point(event),q=state.pointer,original=q.box;let box={...original};if(q.mode==="draw"){box={x1:Math.min(q.start.x,p.x),y1:Math.min(q.start.y,p.y),x2:Math.max(q.start.x,p.x),y2:Math.max(q.start.y,p.y)}}else if(q.mode==="move"){const dx=p.x-q.start.x,dy=p.y-q.start.y,w=original.x2-original.x1,h=original.y2-original.y1,x1=clamp(Math.min(1-w,original.x1+dx)),y1=clamp(Math.min(1-h,original.y1+dy));box={x1,y1,x2:x1+w,y2:y1+h}}else{if(q.mode.includes("n"))box.y1=Math.min(p.y,box.y2-.01);if(q.mode.includes("s"))box.y2=Math.max(p.y,box.y1+.01);if(q.mode.includes("w"))box.x1=Math.min(p.x,box.x2-.01);if(q.mode.includes("e"))box.x2=Math.max(p.x,box.x1+.01)}state.instances=state.instances.map(x=>x.instanceId===q.instanceId?{...x,bbox:box}:x);draw()}
    function pointerUp(event){if(!state.pointer||state.pointer.id!==event.pointerId)return;const instance=state.instances.find(x=>x.instanceId===state.pointer.instanceId);if(instance&&(instance.bbox.x2-instance.bbox.x1<.01||instance.bbox.y2-instance.bbox.y1<.01))deleteBox(instance.instanceId);state.pointer=null;renderInspector();draw()}
    function shortcut(event){const tag=event.target?.tagName?.toLowerCase();if(["input","textarea","select"].includes(tag))return;if((event.metaKey||event.ctrlKey)&&event.key==="Enter"){event.preventDefault();save("submitted",true);return}const key=event.key.toLowerCase();if(key==="j")step(1);else if(key==="k")step(-1);else if(key==="a")addBox();else if(key==="r")resetProposals();else if(event.key==="Delete"||event.key==="Backspace"){if(state.selectedInstanceId)deleteBox(state.selectedInstanceId)}else if(/^[1-5]$/.test(event.key)){const target=Object.keys(TARGETS).find(k=>TARGETS[k][2]===event.key);if(target)setTarget(target)}}
    function formatBox(b){return `${b.x1.toFixed(3)}, ${b.y1.toFixed(3)} → ${b.x2.toFixed(3)}, ${b.y2.toFixed(3)}`}
    function clamp(v){return Math.max(0,Math.min(1,v))}function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c])}function fatal(error){dom.loading.hidden=true;dom.queue.innerHTML=`<div class="empty">${escapeHtml(error.message||error)}</div>`;dom.inspector.innerHTML=`<div class="empty">标注台启动失败。请确认 MM-Fit 哑铃队列已物化。</div>`}
  </script>
