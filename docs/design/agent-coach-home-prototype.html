<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>Power Agent Coach — Throwaway Prototype</title>
    <style>
      :root {
        --paper: #f7f6f2;
        --paper-2: #efeee8;
        --paper-3: #e4e2da;
        --ink: #16181d;
        --ink-2: #5a5e66;
        --ink-3: #969aa2;
        --line: #d8d6ce;
        --lime: #c6f135;
        --lime-deep: #9bc918;
        --lime-ink: #3d4d00;
        --terra: #e85c3a;
        --terra-soft: #fde9e2;
        --dark: #0e100e;
        --dark-2: #181b17;
        --white: #ffffff;
        --radius-xl: 28px;
        --radius-lg: 20px;
        --radius-md: 16px;
        --radius-sm: 12px;
        --shadow: 0 28px 80px rgba(0, 0, 0, 0.28);
        --font-display: "DIN Condensed", "Avenir Next Condensed", "PingFang SC", sans-serif;
        --font-body: "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
        --font-mono: "SFMono-Regular", "Roboto Mono", monospace;
      }

      * { box-sizing: border-box; }

      html, body { min-height: 100%; }

      body {
        margin: 0;
        background: #242621;
        color: var(--ink);
        font-family: var(--font-body);
        -webkit-font-smoothing: antialiased;
      }

      button, input { font: inherit; }
      button { color: inherit; }

      button:focus-visible,
      input:focus-visible {
        outline: 3px solid rgba(198, 241, 53, 0.65);
        outline-offset: 2px;
      }

      .stage {
        min-height: 100vh;
        display: grid;
        grid-template-columns: minmax(240px, 320px) minmax(390px, 430px) minmax(260px, 340px);
        justify-content: center;
        align-items: center;
        gap: 28px;
        padding: 36px;
        position: relative;
        overflow: hidden;
      }

      .stage::before,
      .stage::after {
        content: "";
        position: fixed;
        background: var(--lime);
        opacity: 0.7;
        z-index: -1;
      }

      .stage::before { width: 180px; height: 8px; top: 11%; left: -44px; transform: rotate(-12deg); }
      .stage::after { width: 8px; height: 220px; right: 7%; bottom: -54px; transform: rotate(18deg); }

      .brief-panel,
      .state-panel {
        color: #f5f4ee;
        align-self: center;
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 14px;
        color: var(--lime);
        font: 700 11px/1.2 var(--font-mono);
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .eyebrow::before { content: ""; width: 24px; height: 2px; background: currentColor; }

      .brief-panel h1 {
        max-width: 290px;
        margin: 0;
        font: 800 clamp(42px, 4.2vw, 66px)/0.88 var(--font-display);
        letter-spacing: -0.055em;
        text-transform: uppercase;
      }

      .brief-panel .lede {
        max-width: 285px;
        margin: 22px 0 24px;
        color: #c4c6be;
        font-size: 14px;
        line-height: 1.7;
      }

      .brief-list { display: grid; gap: 10px; }

      .brief-item {
        display: grid;
        grid-template-columns: 30px 1fr;
        gap: 10px;
        color: #d9dbd3;
        font-size: 12px;
        line-height: 1.5;
      }

      .brief-item span:first-child {
        color: var(--lime);
        font: 700 11px/1.4 var(--font-mono);
      }

      .phone-shell {
        width: min(100%, 420px);
        height: min(880px, calc(100vh - 64px));
        min-height: 720px;
        padding: 9px;
        border: 1px solid #484b44;
        border-radius: 42px;
        background: #050605;
        box-shadow: var(--shadow);
        position: relative;
      }

      .phone {
        height: 100%;
        overflow: hidden;
        position: relative;
        border-radius: 34px;
        background: var(--paper);
        isolation: isolate;
      }

      .phone::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0.12;
        z-index: 40;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.72' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.14'/%3E%3C/svg%3E");
        mix-blend-mode: multiply;
      }

      .device-pill {
        position: absolute;
        z-index: 80;
        top: 11px;
        left: 50%;
        width: 108px;
        height: 29px;
        transform: translateX(-50%);
        border-radius: 99px;
        background: #050605;
        pointer-events: none;
      }

      .app { height: 100%; position: relative; }

      .screen {
        height: 100%;
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: none;
        padding: 18px 18px 164px;
      }

      .screen::-webkit-scrollbar { display: none; }

      .statusbar {
        height: 30px;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-bottom: 17px;
        padding: 0 5px;
        font: 700 11px/1 var(--font-mono);
      }

      .status-icons { display: flex; gap: 5px; align-items: center; }
      .signal { width: 15px; height: 8px; border-left: 2px solid; border-bottom: 2px solid; transform: skewX(-18deg); }
      .battery { width: 18px; height: 9px; border: 1.5px solid; border-radius: 3px; position: relative; }
      .battery::before { content: ""; position: absolute; inset: 1.5px; background: currentColor; border-radius: 1px; }

      .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
      .brand { display: flex; align-items: center; gap: 9px; }

      .brand-mark {
        width: 31px;
        height: 31px;
        display: grid;
        place-items: center;
        background: var(--ink);
        color: var(--lime);
        font: 900 20px/1 var(--font-display);
        transform: rotate(-4deg);
      }

      .brand-name { font: 850 18px/1 var(--font-display); letter-spacing: -0.04em; text-transform: uppercase; }
      .brand-sub { margin-top: 3px; color: var(--ink-3); font: 600 9px/1 var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; }

      .icon-button,
      .back-button {
        min-width: 44px;
        min-height: 44px;
        border: 1px solid var(--line);
        border-radius: 99px;
        background: rgba(255,255,255,0.62);
        display: inline-grid;
        place-items: center;
        cursor: pointer;
      }

      .avatar-button { position: relative; }
      .avatar-button::after { content: ""; position: absolute; width: 8px; height: 8px; right: 1px; top: 1px; border: 2px solid var(--paper); border-radius: 50%; background: var(--terra); }

      .hello { margin-bottom: 20px; }
      .date-kicker { margin: 0 0 6px; color: var(--ink-2); font: 700 10px/1 var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; }
      .hello h2 { margin: 0; font: 900 34px/0.98 var(--font-display); letter-spacing: -0.045em; }
      .hello h2 em { color: var(--terra); font-style: normal; }

      .section-head { display: flex; justify-content: space-between; align-items: center; margin: 22px 2px 10px; }
      .section-head h3 { margin: 0; font: 850 15px/1 var(--font-display); letter-spacing: -0.02em; }
      .section-head span { color: var(--ink-3); font: 600 9px/1 var(--font-mono); text-transform: uppercase; letter-spacing: 0.08em; }

      .hero-card {
        position: relative;
        overflow: hidden;
        min-height: 278px;
        padding: 20px;
        border-radius: var(--radius-xl);
        background: var(--dark);
        color: var(--white);
      }

      .hero-card::after {
        content: "05";
        position: absolute;
        right: -8px;
        bottom: -28px;
        color: rgba(255,255,255,0.055);
        font: 900 148px/1 var(--font-display);
        letter-spacing: -0.08em;
      }

      .hero-top { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; }
      .program-chip,
      .tiny-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 99px;
        font: 700 9px/1 var(--font-mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .program-chip { padding: 8px 10px; background: var(--lime); color: var(--lime-ink); }
      .tiny-chip { padding: 7px 9px; background: rgba(255,255,255,0.1); color: #d9dbd4; }
      .tiny-chip i { width: 6px; height: 6px; border-radius: 50%; background: var(--lime); }

      .hero-title { position: relative; z-index: 2; max-width: 270px; margin: 28px 0 8px; font: 900 42px/0.9 var(--font-display); letter-spacing: -0.055em; text-transform: uppercase; }
      .hero-meta { position: relative; z-index: 2; color: #aeb1a9; font-size: 12px; }
      .hero-metrics { position: relative; z-index: 2; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 23px; }
      .hero-metric { padding-top: 10px; border-top: 1px solid #353832; }
      .hero-metric strong { display: block; font: 800 18px/1 var(--font-display); }
      .hero-metric span { color: #858981; font: 600 8px/1 var(--font-mono); text-transform: uppercase; letter-spacing: 0.07em; }
      .hero-actions { position: relative; z-index: 2; display: grid; grid-template-columns: 1fr 50px; gap: 10px; margin-top: 19px; }

      .workout-flip {
        height: 420px;
        position: relative;
        perspective: 1400px;
      }

      .workout-flip-inner {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        transition: transform .72s cubic-bezier(.2,.78,.18,1);
      }

      .workout-flip-inner.is-flipped { transform: rotateY(180deg); }

      .flip-live { position: absolute; inset: 0; }
      .flip-live.flip-back { transform: none; pointer-events: auto; display: grid; grid-template-rows: auto 58px minmax(0, 1fr) 43px; gap: 10px; }
      .card-flip-out { animation: cardFlipOut .2s ease-in both; }
      .card-flip-in { animation: cardFlipIn .34s cubic-bezier(.18,.8,.2,1) both; }

      .flip-face {
        position: absolute;
        inset: 0;
        overflow: hidden;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }

      .flip-front.hero-card { min-height: 0; height: 100%; pointer-events: auto; }
      .flip-back { pointer-events: none; }
      .workout-flip-inner.is-flipped .flip-front { pointer-events: none; }
      .workout-flip-inner.is-flipped .flip-back { pointer-events: auto; }
      .flip-front .hero-title { margin-top: 38px; }

      .flip-back {
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: var(--radius-xl);
        background: var(--white);
        transform: rotateY(180deg);
      }

      .flip-back-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
      .flip-back-head h3 { margin: 7px 0 3px; font: 900 23px/.95 var(--font-display); letter-spacing: -.04em; }
      .flip-back-head p { margin: 0; color: var(--ink-3); font: 650 8px/1.4 var(--font-mono); text-transform: uppercase; }

      .flip-control {
        min-height: 36px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 0 11px;
        border: 1px solid var(--line);
        border-radius: 99px;
        background: var(--paper);
        color: var(--ink-2);
        font: 750 9px/1 var(--font-mono);
        cursor: pointer;
      }

      .flip-front .flip-control { border-color: #3a3d36; background: #242720; color: var(--lime); }
      .flip-control b { font-size: 14px; }
      .flip-hint { position: absolute; z-index: 4; right: 21px; bottom: 18px; color: #7d8178; font: 650 8px/1 var(--font-mono); letter-spacing: .05em; text-transform: uppercase; }

      .flip-stats { min-height: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; overflow: hidden; margin: 0; border: 1px solid var(--line); border-radius: 13px; background: var(--line); }
      .flip-stat { padding: 9px; background: var(--paper); }
      .flip-stat strong { display: block; font: 850 16px/1 var(--font-display); }
      .flip-stat span { color: var(--ink-3); font: 650 7px/1 var(--font-mono); text-transform: uppercase; }
      .flip-console { min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--ink-3) transparent; border: 1px solid var(--line); border-radius: 14px; background: white; }
      .flip-console::-webkit-scrollbar { width: 4px; }
      .flip-console::-webkit-scrollbar-thumb { border-radius: 99px; background: var(--ink-3); }
      .flip-console-row { min-height: 42px; display: grid; grid-template-columns: minmax(0,1fr) 48px 58px 26px; align-items: center; gap: 5px; padding: 6px 8px 6px 10px; border-bottom: 1px solid var(--line); }
      .flip-console-row:last-child { border-bottom: 0; }
      .flip-console-row strong { font-size: 10px; }
      .flip-console-row span { color: var(--ink-2); font: 650 8px/1 var(--font-mono); text-align: right; }
      .flip-console-row .load-next { color: var(--lime-ink); }
      .task-edit-button { width: 26px; height: 26px; border: 0; border-radius: 8px; background: var(--paper-2); color: var(--ink-2); font-size: 9px; font-weight: 900; cursor: pointer; letter-spacing: -1px; }
      .timeline-row { min-height: 54px; grid-template-columns: 1.05fr 1fr 75px; }
      .timeline-row strong { line-height: 1.25; }
      .timeline-row strong small { display: block; margin-bottom: 4px; color: var(--terra); font: 700 7px/1 var(--font-mono); text-transform: uppercase; }
      .timeline-row span { text-align: left; line-height: 1.35; overflow-wrap: anywhere; }
      .timeline-row span:last-child { color: var(--ink-3); }
      .flip-back-actions { display: grid; grid-template-columns: 1.4fr 1fr; gap: 8px; margin-top: 0; }
      .flip-back-actions .primary-button,
      .flip-back-actions .secondary-button { min-height: 43px; font-size: 11px; }
      .task-list-wrap { min-height: 0; position: relative; display: flex; flex-direction: column; }
      .task-list-wrap::after { content: ""; display: none; position: absolute; z-index: 3; right: 1px; bottom: 1px; left: 1px; height: 25px; border-radius: 0 0 13px 13px; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,.96)); pointer-events: none; }
      .task-list-wrap.is-scrollable:not(:focus-within)::after { display: block; }
      .task-list-wrap .flip-console { height: auto; flex: 1; }
      .scenario-label { display: inline-flex; align-items: center; gap: 5px; color: var(--terra); font: 750 9px/1 var(--font-mono); letter-spacing: .07em; text-transform: uppercase; }
      .task-list-wrap.is-empty::after { display: none; }
      .activity-empty { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
      .activity-empty b { font-size: 11px; }
      .activity-empty span { max-width: 230px; margin-top: 7px; color: var(--ink-3); font-size: 9px; line-height: 1.5; }
      .list-mode-bar { min-height: 30px; display: flex; align-items: center; gap: 4px; padding: 0 3px 6px; }
      .list-mode-bar button { min-height: 27px; padding: 0 10px; border: 0; border-radius: 99px; background: transparent; color: var(--ink-3); font-size: 8px; font-weight: 800; cursor: pointer; }
      .list-mode-bar button.active { background: var(--ink); color: var(--lime); }
      .list-mode-bar strong { font-size: 10px; }
      .list-mode-bar span { margin-left: auto; color: var(--ink-3); font-size: 9px; }

      .coach-alert { min-height: 66px; display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; margin-bottom: 12px; padding: 10px 11px; border: 1px solid var(--line); border-radius: 17px; background: rgba(255,255,255,.78); box-shadow: 0 8px 24px rgba(32,34,29,.05); }
      .coach-alert.pending { border-color: var(--line); background: rgba(255,255,255,.78); }
      .coach-alert-icon { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 11px; background: var(--terra-soft); color: var(--terra); font-size: 14px; font-weight: 900; }
      .coach-alert.pending .coach-alert-icon { background: #edf4d8; color: #6f8e0f; }
      .coach-alert-copy small { display: block; color: var(--ink-3); font-size: 8px; font-weight: 750; }
      .coach-alert.pending .coach-alert-copy small { color: var(--ink-3); }
      .coach-alert-copy strong { display: block; margin-top: 3px; font-size: 11px; line-height: 1.25; }
      .coach-alert-copy span { display: block; margin-top: 3px; color: var(--ink-2); font-size: 9px; line-height: 1.35; }
      .coach-alert-actions { display: flex; gap: 5px; }
      .coach-alert-actions button { min-height: 32px; padding: 0 9px; border: 0; border-radius: 99px; background: var(--paper-2); color: var(--ink-2); font-size: 9px; font-weight: 800; cursor: pointer; }
      .coach-alert-actions button:last-child { background: var(--ink); color: white; }
      .coach-alert.pending .coach-alert-actions button { border-color: transparent; color: var(--ink-2); }
      .coach-alert.pending .coach-alert-actions button:last-child { color: white; }

      .home-timeline { position: relative; padding: 2px 0 10px; }
      .home-timeline::before { content: ""; position: absolute; left: 28px; top: 12px; bottom: 20px; width: 1px; background: var(--line); }
      .timeline-event { position: relative; display: grid; grid-template-columns: 44px 1fr; gap: 10px; min-height: 66px; padding: 8px 0; }
      .timeline-time { position: relative; padding-top: 4px; color: var(--ink-3); font: 700 8px/1 var(--font-mono); }
      .timeline-time::after { content: ""; position: absolute; z-index: 2; right: 8px; top: 7px; width: 7px; height: 7px; border: 3px solid var(--paper); border-radius: 50%; background: var(--terra); }
      .timeline-event.training .timeline-time::after { background: var(--lime-deep); }
      .timeline-event-card { padding: 10px 12px; border: 1px solid var(--line); border-radius: 15px; background: rgba(255,255,255,.72); }
      .timeline-event-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .timeline-event-head small { color: var(--terra); font: 750 7px/1 var(--font-mono); text-transform: uppercase; }
      .timeline-event-head span { color: var(--ink-3); font-size: 8px; }
      .timeline-event-card strong { display: block; margin-top: 5px; font-size: 11px; }
      .timeline-event-card p { margin: 4px 0 0; color: var(--ink-2); font-size: 9px; line-height: 1.45; }
      .timeline-tools { display: flex; gap: 5px; }
      .timeline-tools button { min-height: 31px; padding: 0 10px; border: 1px solid var(--line); border-radius: 99px; background: white; font-size: 9px; font-weight: 800; cursor: pointer; }

      .calendar-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 15px; }
      .calendar-heading h2 { margin: 4px 0 0; font: 900 34px/.92 var(--font-display); letter-spacing: -.05em; }
      .calendar-mode { display: flex; gap: 3px; padding: 3px; border: 1px solid var(--line); border-radius: 99px; background: white; }
      .calendar-mode button { min-height: 31px; padding: 0 10px; border: 0; border-radius: 99px; background: transparent; color: var(--ink-3); font-size: 8px; font-weight: 800; cursor: pointer; }
      .calendar-mode button.active { background: var(--ink); color: var(--lime); }
      .month-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); margin: 3px 0 5px; color: var(--ink-3); font: 650 7px/1 var(--font-mono); text-align: center; }
      .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
      .month-day { min-width: 0; min-height: 43px; position: relative; padding: 7px 4px; border: 1px solid transparent; border-radius: 11px; background: rgba(255,255,255,.58); cursor: pointer; text-align: left; }
      .month-day.muted { opacity: .25; pointer-events: none; }
      .month-day strong { display: block; font: 800 10px/1 var(--font-display); }
      .month-day i { position: absolute; left: 6px; bottom: 6px; width: 5px; height: 5px; border-radius: 50%; background: var(--paper-3); }
      .month-day.has-events i { background: var(--terra); }
      .month-day.has-plan::after { content: ""; position: absolute; left: 15px; bottom: 6px; width: 5px; height: 5px; border-radius: 50%; background: var(--lime-deep); }
      .month-day.active { border-color: var(--ink); background: var(--ink); color: white; }
      .day-detail { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
      .day-detail-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 7px; }
      .day-detail-head h3 { margin: 5px 0 0; font: 850 21px/1 var(--font-display); }
      .day-plan-binding { max-width: 150px; display: inline-flex; align-items: center; gap: 6px; padding: 7px 9px; border-radius: 99px; background: var(--dark); color: white; font: 650 8px/1.3 var(--font-mono); }
      .day-plan-binding i { width: 6px; height: 6px; border-radius: 50%; background: var(--lime); }
      button.day-plan-binding { border: 0; cursor: pointer; }
      .day-plan-binding b { color: var(--lime); font-size: 12px; }

      .primary-button,
      .secondary-button,
      .text-button {
        min-height: 48px;
        border: 0;
        border-radius: 99px;
        cursor: pointer;
        font-weight: 800;
      }
      .primary-button { background: var(--lime); color: var(--lime-ink); }
      .primary-button.dark { background: var(--ink); color: white; }
      .secondary-button { border: 1px solid var(--line); background: var(--white); color: var(--ink); }
      .text-button { min-height: 44px; background: transparent; color: var(--ink-2); }
      .round-adjust { font-size: 20px; background: #292c27; color: var(--lime); }

      .change-card {
        padding: 16px;
        border: 1px solid rgba(232,92,58,0.3);
        border-left: 4px solid var(--terra);
        border-radius: var(--radius-lg);
        background: var(--terra-soft);
      }
      .change-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
      .change-tag { color: var(--terra); font: 750 9px/1 var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; }

      .console-actions { display: grid; grid-template-columns: 1.5fr 1fr; gap: 9px; margin: 11px 0 18px; }

      .console-stat { padding: 13px 9px; background: var(--paper); }

      .report-hero {

        padding: 21px;

        background: var(--dark);
        color: white;
      }

      .next-proposal { margin-top: 11px; padding: 15px; border-left: 4px solid var(--lime-deep); border-radius: var(--radius-lg); background: #eef6d2; }

      @keyframes cardFlipOut { to { opacity: .15; transform: rotateY(88deg) scale(.96); } }

      .dock {

      .composer-placeholder { flex: 1; color: var(--ink-2); font-size: 11px; }

      .nav-tabs { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 7px; }

      .page-title { margin: 4px 0 18px; }

      .week-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-bottom: 14px; }

      .calendar-session { padding: 17px; border-radius: var(--radius-xl); background: var(--dark); color: white; }

      .exercise-item span { color: var(--ink-3); font-size: 8px; }

      .field-stack { display: grid; gap: 9px; }

      .plan-manager-edit { width: 28px; height: 28px; border: 0; border-radius: 9px; background: var(--paper-2); color: var(--ink-2); font-weight: 900; cursor: pointer; }

      .danger-button { width: 100%; min-height: 44px; margin-top: 9px; border: 0; border-radius: 99px; background: transparent; color: var(--terra); font-weight: 800; cursor: pointer; }

      .audit-screen { background: var(--paper); }

      .audit-summary { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: end; padding: 17px; border-radius: 20px; background: var(--dark); color: white; }
      .audit-summary small { color: var(--lime); font: 750 8px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; }
      .audit-summary strong { display: block; margin-top: 8px; font: 900 24px/.95 var(--font-display); }
      .audit-summary p { margin: 7px 0 0; color: #92968d; font-size: 9px; line-height: 1.45; }

      .audit-item::before { content: ""; position: absolute; top: 17px; left: 17px; width: 8px; height: 8px; border: 2px solid var(--paper); border-radius: 50%; background: var(--ink-3); box-shadow: 0 0 0 1px var(--line); }
      .audit-item.write::before { background: var(--terra); }

      .audit-item-head { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
      .audit-item-head small { color: var(--ink-3); font: 700 7px/1.3 var(--font-mono); }

      .goal-card { padding: 18px; border-radius: var(--radius-xl); background: var(--dark); color: white; }

      .goal-numbers strong { display: block; font: 900 32px/1 var(--font-display); }

      .mode-list { display: grid; gap: 9px; margin-top: 14px; }

      .overlay {
        position: absolute;

      .quick-prompts { display: flex; gap: 6px; overflow-x: auto; padding: 0 15px 8px; scrollbar-width: none; }

      .chat-composer { position: absolute; z-index: 3; left: 0; right: 0; bottom: 0; padding: 7px 14px max(13px, env(safe-area-inset-bottom)); background: rgba(247,246,242,.96); border-top: 1px solid var(--line); }
      .chat-input-row { display: flex; gap: 7px; }

      .session-step { color: var(--lime); font: 700 9px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; }
      .session-title { margin: 54px 0 9px; font: 900 51px/.86 var(--font-display); letter-spacing: -.06em; text-transform: uppercase; }
      .session-prescription { color: #afb2aa; font-size: 13px; }

      .session-ring span { color: #888c84; font: 700 8px/1 var(--font-mono); text-transform: uppercase; }
      .session-cue { padding: 15px; border-left: 3px solid var(--lime); background: #1a1d19; color: #d9dbd4; font-size: 11px; line-height: 1.5; }
      .next-set-card { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 5px 12px; align-items: center; margin-top: 14px; padding: 13px 14px; border: 1px solid #33372f; border-radius: 17px; background: #171a16; }
      .next-set-card small { color: #858981; font-size: 8px; font-weight: 750; }

      .next-set-card span { color: #aeb1a9; font-size: 9px; }
      .next-set-card button { grid-column: 2; grid-row: 1 / span 3; min-height: 34px; padding: 0 12px; border: 1px solid #3c4038; border-radius: 99px; background: #242720; color: var(--lime); font-size: 9px; font-weight: 800; cursor: pointer; }
      .next-set-card.changed { border-color: rgba(198,241,53,.45); }
      .session-screen .hero-actions { margin-top: 14px; }
      .session-finish { width: 100%; min-height: 42px; margin-top: 8px; border: 0; background: transparent; color: #81867c; font-size: 10px; cursor: pointer; }

      .camera-screen { overflow: hidden; background: #080a08; color: white; }
      .camera-screen .statusbar { position: absolute; z-index: 8; top: 18px; left: 18px; right: 18px; width: auto; margin: 0; padding: 0 5px; color: white; }
      .camera-viewport { position: relative; width: 100%; height: 100%; overflow: hidden; background: radial-gradient(circle at 52% 38%, #50544e 0, #282c28 30%, #111411 68%, #070807 100%); }
      .camera-viewport::before { content: ""; position: absolute; inset: 0; background: linear-gradient(118deg, rgba(255,255,255,.07), transparent 31%), linear-gradient(to top, rgba(0,0,0,.55), transparent 46%); }
      .camera-floor { position: absolute; left: -20%; right: -20%; bottom: -15%; height: 48%; border-top: 1px solid rgba(255,255,255,.09); background: repeating-linear-gradient(90deg, transparent 0 60px, rgba(255,255,255,.035) 61px 62px), linear-gradient(to bottom, rgba(255,255,255,.025), rgba(0,0,0,.45)); transform: perspective(260px) rotateX(58deg); transform-origin: top; }
      .camera-status { position: absolute; z-index: 8; top: 0; left: 0; right: 0; color: white; }
      .pose-skeleton { position: absolute; z-index: 2; left: 50%; top: 48%; width: 330px; height: 430px; transform: translate(-50%,-50%); filter: drop-shadow(0 0 8px rgba(198,241,53,.23)); }
      .pose-skeleton line, .pose-skeleton polyline { fill: none; stroke: var(--lime); stroke-width: 3.1; stroke-linecap: round; stroke-linejoin: round; }
      .pose-skeleton circle { fill: white; stroke: var(--lime-deep); stroke-width: 1.4; }
      .pose-person-shadow { position: absolute; z-index: 1; left: 50%; top: 54%; width: 310px; height: 92px; transform: translate(-50%,-50%) rotate(5deg); border-radius: 50%; background: rgba(8,10,8,.42); filter: blur(18px); }
      .camera-hud-top { position: absolute; z-index: 5; top: 58px; left: 18px; right: 18px; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
      .phase-pill, .rec-chip { min-height: 34px; display: inline-flex; align-items: center; gap: 7px; padding: 0 12px; border-radius: 99px; backdrop-filter: blur(8px); font-size: 10px; font-weight: 850; }
      .phase-pill { border: 1px solid rgba(198,241,53,.34); background: rgba(14,16,14,.68); color: var(--lime); }
      .phase-pill i, .rec-chip i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
      .rec-chip { border: 1px solid rgba(232,92,58,.5); background: rgba(232,92,58,.18); color: #ff8a6b; font-family: var(--font-mono); }
      .frame-banner { position: absolute; z-index: 5; top: 104px; left: 18px; right: 18px; padding: 10px 13px; border: 1px solid rgba(198,241,53,.35); border-radius: 13px; background: rgba(198,241,53,.12); color: var(--lime); font-size: 10px; font-weight: 750; backdrop-filter: blur(8px); }
      .camera-reps { position: absolute; z-index: 5; left: 20px; bottom: 210px; }
      .camera-reps strong { display: block; color: var(--lime); font: 900 72px/.8 var(--font-display); letter-spacing: -.06em; }
      .camera-reps span { display: block; margin-top: 10px; color: rgba(255,255,255,.58); font: 750 9px/1 var(--font-mono); letter-spacing: .18em; }
      .camera-telemetry { position: absolute; z-index: 5; right: 18px; bottom: 211px; display: grid; gap: 6px; justify-items: end; }
      .camera-telemetry span { padding: 6px 9px; border: 1px solid rgba(255,255,255,.1); border-radius: 9px; background: rgba(14,16,14,.62); color: rgba(255,255,255,.74); font: 650 8px/1 var(--font-mono); backdrop-filter: blur(8px); }
      .camera-telemetry b { color: var(--lime); }
      .camera-agent-strip { position: absolute; z-index: 5; left: 18px; right: 18px; bottom: 126px; display: grid; grid-template-columns: 25px minmax(0,1fr) auto; gap: 10px; align-items: center; min-height: 59px; padding: 10px 11px; border: 1px solid rgba(255,255,255,.1); border-left: 4px solid var(--lime); border-radius: 14px; background: rgba(14,16,14,.75); backdrop-filter: blur(10px); }
      .camera-agent-icon { width: 25px; height: 25px; display: grid; place-items: center; border-radius: 50%; background: var(--lime); color: var(--lime-ink); font-size: 11px; }
      .camera-agent-copy strong { display: block; font-size: 10px; }
      .camera-agent-copy span { display: block; margin-top: 4px; color: rgba(255,255,255,.42); font: 650 7px/1 var(--font-mono); }
      .camera-agent-strip button { min-height: 32px; padding: 0 9px; border: 1px solid rgba(255,255,255,.13); border-radius: 99px; background: rgba(255,255,255,.09); color: var(--lime); font-size: 8px; font-weight: 800; cursor: pointer; }
      .camera-controls { position: absolute; z-index: 5; right: 0; bottom: 0; left: 0; display: grid; grid-template-columns: 52px 1fr 52px; gap: 12px; align-items: center; padding: 0 22px 30px; }
      .camera-icon-btn { width: 52px; height: 52px; border: 1px solid rgba(255,255,255,.16); border-radius: 17px; background: rgba(255,255,255,.12); color: white; font-size: 16px; font-weight: 800; cursor: pointer; backdrop-filter: blur(8px); }
      .camera-end-btn { height: 52px; border: 0; border-radius: 17px; background: var(--terra); color: white; font-size: 13px; font-weight: 900; letter-spacing: .12em; cursor: pointer; }

      /* Performance Editorial pass — compact plan hierarchy + contextual Coach drawer. */
      .screen.nav-only { padding-bottom: 96px; }
      .workout-flip { height: 356px; }
      .hero-card { min-height: 0; padding: 18px; }
      .flip-front.hero-card { display: flex; flex-direction: column; }
      .hero-card::after { content: "W05"; right: -4px; bottom: 49px; font-size: 86px; opacity: .72; }
      .flip-front .hero-title { max-width: 245px; margin: 26px 0 7px; font-size: 39px; line-height: .9; }
      .hero-meta { font-size: 10px; }
      .hero-metrics { gap: 12px; margin-top: 18px; }
      .hero-metric { padding-top: 9px; }
      .hero-metric strong { font-size: 17px; }
      .hero-actions { margin-top: auto; }
      .flip-front .hero-actions { padding-top: 16px; }
      .program-chip { max-width: 210px; min-height: 34px; padding: 0 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .flip-front .flip-control { min-height: 34px; }
      .flip-back { padding: 14px; }
      .flip-live.flip-back { grid-template-rows: auto 52px minmax(0,1fr) 43px; gap: 8px; }

      .dock { border-radius: 22px; }
      .dock.nav-only { padding: 5px 8px; }
      .dock.nav-only .nav-tabs { margin-top: 0; }
      .dock.drawer-active { padding: 5px 8px; }
      .dock.drawer-active .nav-tabs { margin-top: 0; }
      .composer { min-height: 46px; border-radius: 15px; }
      .composer-main { min-height: 35px; }
      .composer-plus { width: 34px; height: 34px; border-radius: 11px; }

      .coach-drawer {
        position: absolute;
        z-index: 95;
        left: 8px;
        right: 8px;
        bottom: 10px;
        height: 80%;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid rgba(216,214,206,.92);
        border-radius: 27px;
        background: rgba(247,246,242,.985);
        box-shadow: 0 -18px 60px rgba(14,16,14,.22);
        backdrop-filter: blur(22px);
        transform-origin: bottom center;
        will-change: transform, opacity;
      }
      .coach-drawer.general { left: 12px; right: 12px; }
      .coach-drawer.full { top: 18px; bottom: 10px; height: auto; border-radius: 28px; }
      .coach-drawer.training { bottom: 8px; height: 80%; border-color: rgba(255,255,255,.42); }
      .coach-drawer.training.full { top: 18px; height: auto; }
      .coach-drawer-backdrop { position: absolute; z-index: 90; inset: 0; border: 0; background: rgba(7,8,7,.34); backdrop-filter: blur(1.5px); cursor: default; }
      .drawer-grab { width: 100%; height: 25px; flex: 0 0 auto; display: grid; place-items: center; border: 0; background: transparent; cursor: pointer; }
      .drawer-grab::after { content: ""; width: 36px; height: 4px; border-radius: 99px; background: var(--line); }
      .drawer-head { min-height: 47px; display: grid; grid-template-columns: 34px minmax(0,1fr) auto; gap: 9px; align-items: center; padding: 0 13px 9px; border-bottom: 1px solid var(--line); }
      .drawer-agent-mark { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 11px; background: var(--ink); color: var(--lime); font-size: 14px; }
      .drawer-title strong { display: block; font: 850 13px/1.15 var(--font-display); }
      .drawer-title span { display: block; margin-top: 4px; color: var(--ink-3); font: 650 7px/1 var(--font-mono); text-transform: uppercase; }
      .drawer-head-actions { display: flex; gap: 5px; }
      .drawer-head-actions button { min-width: 32px; height: 32px; padding: 0 9px; border: 1px solid var(--line); border-radius: 11px; background: white; font-size: 9px; font-weight: 800; cursor: pointer; }
      .drawer-head-actions .end-set-mini { border-color: transparent; background: var(--terra); color: white; }
      .drawer-context { display: flex; align-items: center; gap: 8px; margin: 9px 12px 0; padding: 8px 10px; border-radius: 12px; background: var(--dark); color: white; }
      .drawer-context i { width: 7px; height: 7px; border-radius: 50%; background: var(--lime); }
      .drawer-context strong { min-width: 0; flex: 1; overflow: hidden; font-size: 9px; text-overflow: ellipsis; white-space: nowrap; }
      .drawer-context span { color: #8f938a; font: 650 7px/1 var(--font-mono); }
      .drawer-body { min-height: 0; flex: 1; overflow-y: auto; padding: 10px 12px 118px; overscroll-behavior: contain; scrollbar-width: none; }
      .coach-drawer.general .drawer-body { padding-bottom: 170px; }
      .drawer-body::-webkit-scrollbar { display: none; }
      .drawer-messages { display: grid; gap: 9px; }
      .drawer-message { max-width: 88%; padding: 9px 11px; border-radius: 14px; font-size: 9px; line-height: 1.5; }
      .drawer-message.agent { justify-self: start; border: 1px solid var(--line); border-top-left-radius: 5px; background: white; }
      .drawer-message.user { justify-self: end; border-top-right-radius: 5px; background: var(--ink); color: white; }
      .drawer-composer { position: absolute; z-index: 3; right: 0; bottom: 0; left: 0; padding: 7px 11px 10px; border-top: 1px solid var(--line); background: rgba(247,246,242,.97); }
      .coach-drawer.general .drawer-composer { bottom: 55px; }
      .drawer-prompts { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
      .drawer-prompts button { min-height: 29px; flex: 0 0 auto; padding: 0 10px; border: 1px solid var(--line); border-radius: 99px; background: white; color: var(--ink-2); font-size: 8px; font-weight: 750; cursor: pointer; }
      .drawer-input-row { display: grid; grid-template-columns: 38px minmax(0,1fr) 40px; gap: 6px; }
      .drawer-input-row input { min-width: 0; min-height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 13px; background: white; }
      .voice-button, .drawer-send { border: 0; border-radius: 13px; background: var(--ink); color: var(--lime); font-size: 14px; cursor: pointer; }
      .voice-button.listening { background: var(--terra); color: white; animation: voicePulse 1s ease-in-out infinite; }

      .coach-output-card { overflow: hidden; border: 1px solid var(--line); border-radius: 16px; background: white; }
      .coach-output-card.accent { border-left: 4px solid var(--lime-deep); }
      .coach-output-card.warn { border-left: 4px solid var(--terra); }
      .output-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; padding: 11px 12px 0; }
      .output-card-head span { color: var(--terra); font: 750 7px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; }
      .output-card-head b { color: var(--ink-3); font: 700 7px/1 var(--font-mono); }
      .coach-output-card h3 { margin: 7px 12px 5px; font: 850 15px/1.05 var(--font-display); }
      .coach-output-card > p { margin: 0 12px 10px; color: var(--ink-2); font-size: 8px; line-height: 1.5; }
      .output-metrics { display: grid; grid-template-columns: repeat(3,1fr); gap: 1px; margin: 9px 11px 11px; overflow: hidden; border-radius: 11px; background: var(--line); }
      .output-metric { padding: 9px 7px; background: var(--paper-2); }
      .output-metric strong { display: block; font: 850 14px/1 var(--font-display); }
      .output-metric span { color: var(--ink-3); font: 650 6px/1.2 var(--font-mono); text-transform: uppercase; }
      .output-diff { display: grid; grid-template-columns: 1fr 18px 1fr; gap: 5px; align-items: center; margin: 9px 11px 11px; padding: 9px; border-radius: 11px; background: var(--paper-2); }
      .output-diff small { display: block; color: var(--ink-3); font-size: 7px; }
      .output-diff strong { display: block; margin-top: 3px; font-size: 9px; }
      .output-diff b { color: var(--terra); text-align: center; }
      .output-card-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 0 11px 11px; }
      .output-card-actions button { min-height: 35px; border: 1px solid var(--line); border-radius: 11px; background: white; font-size: 8px; font-weight: 850; cursor: pointer; }
      .output-card-actions button.primary { border-color: var(--ink); background: var(--ink); color: white; }
      .output-source { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 11px; border-top: 1px solid var(--line); color: var(--ink-3); font: 650 6px/1.3 var(--font-mono); }
      .live-cue { display: grid; grid-template-columns: 28px minmax(0,1fr) auto; gap: 8px; align-items: center; }
      .live-cue i { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 9px; background: #edf4d8; color: var(--lime-ink); font-style: normal; font-weight: 900; }
      .live-cue strong { display: block; font-size: 9px; }
      .live-cue span { display: block; margin-top: 4px; color: var(--ink-3); font-size: 7px; }
      .live-cue b { color: var(--lime-ink); font: 800 8px/1 var(--font-mono); }
      .drawer-nav { position: absolute; z-index: 4; right: 0; bottom: 0; left: 0; height: 56px; margin: 0; padding: 4px 8px 5px; border-top: 1px solid var(--line); background: rgba(247,246,242,.985); }
      .drawer-nav .nav-tab { min-height: 46px; }

      /* The Coach surface grows out of the existing bottom operation bar. Only the
         shell morphs; messages do not replay the entrance on every render. */
      .coach-drawer.is-entering {
        pointer-events: none;
        overflow: hidden;
        backdrop-filter: none;
        animation: coachBubbleOpen .46s cubic-bezier(.16,1,.3,1) both;
      }
      .coach-drawer.is-entering > * {
        animation: coachContentIn .22s .16s ease-out both;
      }
      .coach-drawer-backdrop.is-entering { animation: coachBackdropIn .34s ease-out both; }
      .coach-drawer.is-closing {
        pointer-events: none;
        overflow: hidden;
        backdrop-filter: none;
        animation: coachBubbleClose .3s cubic-bezier(.7,0,.84,0) both;
      }
      .coach-drawer.is-closing > * {
        animation: coachContentOut .12s ease-in both;
      }
      .coach-drawer-backdrop.is-closing { pointer-events:none; animation: coachBackdropOut .28s ease-in both; }

      @keyframes coachBubbleOpen {
        from { transform:translateY(7px) scaleX(.985) scaleY(.17); border-radius:30px / 140px; box-shadow:0 -4px 18px rgba(14,16,14,.08); }
        to { transform:none; border-radius:27px; box-shadow:0 -18px 60px rgba(14,16,14,.22); }
      }
      @keyframes coachBubbleClose {
        from { transform:none; border-radius:27px; }
        to { transform:translateY(7px) scaleX(.985) scaleY(.17); border-radius:30px / 140px; box-shadow:0 -4px 18px rgba(14,16,14,.08); }
      }
      @keyframes coachContentIn { from { opacity:0; } to { opacity:1; } }
      @keyframes coachContentOut { to { opacity:0; } }
      @keyframes coachBackdropIn { from { opacity:0; backdrop-filter:blur(0); } to { opacity:1; backdrop-filter:blur(1.5px); } }
      @keyframes coachBackdropOut { to { opacity:0; backdrop-filter:blur(0); } }
      @keyframes voicePulse { 50% { transform:scale(.94); box-shadow:0 0 0 6px rgba(232,92,58,.15); } }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior:auto !important; animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
      }

      .toast { position: absolute; z-index: 100; left: 50%; bottom: 135px; transform: translateX(-50%); padding: 10px 15px; border-radius: 99px; background: var(--ink); color: white; font-size: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.2); animation: toast .25s ease-out both; white-space: nowrap; }

      .state-panel { max-width: 320px; }
      .state-panel h2 { margin: 0 0 16px; font: 850 21px/1 var(--font-display); }
      .state-box { padding: 16px; border: 1px solid #444740; border-radius: 18px; background: #1a1c18; }
      .state-row { display: grid; grid-template-columns: 98px 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px solid #33362f; font: 650 10px/1.4 var(--font-mono); }
      .state-row:last-child { border-bottom: 0; }
      .state-row span:first-child { color: #777c72; }
      .state-row span:last-child { color: var(--lime); overflow-wrap: anywhere; }
      .boundary-note { margin-top: 13px; padding: 14px; border-left: 3px solid var(--terra); background: #1a1c18; color: #b9bcb3; font-size: 11px; line-height: 1.6; }

      .variant-switcher {
        position: fixed;
        z-index: 150;
        left: 50%;
        top: 14px;
        display: flex;
        gap: 4px;
        transform: translateX(-50%);
        padding: 5px;
        border: 1px solid #4a4d45;
        border-radius: 99px;
        background: rgba(14,16,14,.9);
        box-shadow: 0 10px 40px rgba(0,0,0,.25);
        backdrop-filter: blur(16px);
      }
      .variant-switcher button { min-height: 38px; padding: 0 14px; border: 0; border-radius: 99px; background: transparent; color: #9b9f95; font-size: 10px; font-weight: 750; cursor: pointer; }
      .variant-switcher button.active { background: var(--lime); color: var(--lime-ink); }

      @keyframes enter { from { opacity: 0; transform: translateX(16px); } }
      @keyframes rise { from { opacity: 0; transform: translateY(24px) scale(.98); } }
      @keyframes toast { from { opacity: 0; transform: translate(-50%, 8px); } }

      @media (max-width: 1050px) {
        .stage { grid-template-columns: minmax(390px, 430px) minmax(250px, 320px); }
        .brief-panel { display: none; }
      }

      @media (max-width: 760px) {
        body { background: var(--paper); }
        .stage { display: block; min-height: 100svh; padding: 0; }
        .state-panel { display: none; }
        .phone-shell { width: 100%; height: 100svh; min-height: 650px; padding: 0; border: 0; border-radius: 0; box-shadow: none; }
        .phone { border-radius: 0; }
        .device-pill { top: 8px; }
        .variant-switcher { top: auto; bottom: 4px; max-width: calc(100vw - 16px); }
        .variant-switcher button { padding: 0 10px; }
        .dock { bottom: 45px; }
        .screen { padding-bottom: 200px; }
        .toast { bottom: 178px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
      }

  <body>
    <!-- PROTOTYPE ONLY: throwaway UI used to validate information architecture and capability boundaries. -->
    <main class="stage">
      <aside class="brief-panel" aria-label="Prototype brief">
        <p class="eyebrow">Throwaway prototype · v0.1</p>
        <h1 id="variantTitle">Coach<br />Workbench</h1>
        <p class="lede">不是“聊天机器人首页”，而是一个每天可执行、可解释、可撤销的训练计划工作台。</p>
        <div class="brief-list">
          <div class="brief-item"><span>01</span><div>先看到今天练什么，再决定要不要调整或询问。</div></div>
          <div class="brief-item"><span>02</span><div>Agent 的建议以计划差异卡呈现，不埋在对话气泡里。</div></div>
          <div class="brief-item"><span>03</span><div>低风险修改可自动执行并撤销，高影响修改必须预览。</div></div>
        </div>
      </aside>

      <section class="phone-shell" aria-label="Mobile app prototype">
        <div class="device-pill"></div>
        <div class="phone">
          <div id="app" class="app"></div>
        </div>
      </section>

      <aside class="state-panel" aria-live="polite">
        <p class="eyebrow">Visible app state</p>
        <h2>每次点击后发生了什么</h2>
        <div id="stateBox" class="state-box"></div>
        <div class="boundary-note">这个面板只用于讨论能力边界，正式产品不会出现。它让“Agent 建议”和“Agent 已执行”不会被混淆。</div>
      </aside>
    </main>

    <nav class="variant-switcher" aria-label="Switch prototype variant">
      <button data-variant="workbench">A · 今日</button>
      <button data-variant="briefing">B · 日简报</button>
      <button data-variant="console">C · 训练台</button>
    </nav>

    <script>
      const params = new URLSearchParams(location.search);
      const validVariants = ["workbench", "briefing", "console"];
      const state = {
        variant: validVariants.includes(params.get("v")) ? params.get("v") : "workbench",
        view: "today",
        overlay: null,
        chatContext: "今日训练",
        coachDrawer: "closed",
        coachSurface: "general",
        voiceListening: false,
        trainingCoachCard: "live",
        coachCards: [
          { id:"plan-today", type:"plan", title:"今天的上肢推", subtitle:"卧推优先，附件组控制疲劳", meta:"计划 v12" }
        ],
        planVersion: 12,
        workoutStatus: "planned",
        cardFace: "summary",
        completedSets: 0,
        coachMode: null,
        coachObserved: false,
        planScenario: "strength",
        cardListView: "tasks",
        planTasks: {
          strength: [
            { name:"杠铃卧推", scheme:"4×8", load:"62.5 kg" },
            { name:"上斜哑铃推", scheme:"3×10", load:"22.5 kg" },
            { name:"坐姿肩推", scheme:"3×10", load:"少 1 组" },
            { name:"侧平举", scheme:"4×15", load:"8 kg" },
            { name:"绳索下压", scheme:"3×12", load:"25 kg" },
            { name:"夹胸", scheme:"3×15", load:"20 kg" },
            { name:"肩袖整理", scheme:"2×15", load:"轻阻力" },
            { name:"训练后拉伸", scheme:"6 min", load:"完成" }
          ],
          bodyweight: [
            { name:"动态热身", scheme:"5 min", load:"完成" },
            { name:"俯卧撑", scheme:"4×12", load:"RIR 3" },
            { name:"保加利亚分腿蹲", scheme:"3×10/侧", load:"自重" },
            { name:"臀桥", scheme:"4×15", load:"停顿 2s" },
            { name:"俯身 Y-T-W", scheme:"3×8", load:"慢速" },
            { name:"死虫", scheme:"3×10/侧", load:"控制" },
            { name:"平板支撑", scheme:"3×40s", load:"呼吸" },
            { name:"全身放松", scheme:"5 min", load:"完成" }
          ],
          cardio: [],
          rest: []
        },
        editingTaskIndex: null,
        planManagerSource: "today",
        activeExercise: { name:"杠铃卧推", reps:"8", load:"62.5 kg" },
        nextSetOverride: null,
        timelineEvents: [
          { time: "07:32", type: "睡眠", name: "睡眠 7h 12m", detail: "HRV 58ms · 静息心率 56", source: "Health + WHOOP" },
          { time: "08:06", type: "身体", name: "体重 82.4 kg", detail: "体脂 20.6% · 7 日趋势 -0.3kg", source: "智能体脂秤" },
          { time: "08:28", type: "饮食", name: "早餐", detail: "约 520 kcal · 蛋白质 36g", source: "照片 + 用户确认" },
          { time: "12:42", type: "饮食", name: "午餐", detail: "约 730 kcal · 蛋白质 48g", source: "手动记录" }
        ],
        timelineOverrides: {},
        timelineTargetDate: "2026-08-08",
        selectedDay: "2026-08-08",
        calendarMode: "week",
        replacementApplied: false,
        replacementName: "上斜哑铃推",
        customExerciseAdded: false,
        exerciseSwapTarget: null,
        progressRange: "12w",
        flipping: false,
        autoChangeApplied: true,
        proposal: null,
        actionLogFilter: "all",
        actionLogSequence: 1204,
        actionLog: [
          { id:"ACT-1203", time:"07:34", type:"write", title:"降低今日卧推重量", detail:"只调整今天，不改变后续训练周。", before:"65 kg × 8", after:"62.5 kg × 8", evidence:"睡眠比基线少 48 分钟；上次末两组未达到目标次数。", scope:"今日计划 · v12", status:"applied", reversible:true, target:"auto-adjust" },
          { id:"ACT-1202", time:"07:34", type:"decision", title:"生成恢复优先建议", detail:"结合恢复状态和最近两次卧推表现，选择日内降重。", evidence:"规则：维持目标次数与动作质量优先于单次负荷。", scope:"决策草稿", status:"recorded", reversible:false },
          { id:"ACT-1201", time:"07:33", type:"read", title:"读取恢复与训练历史", detail:"读取睡眠、HRV、RIR 与最近两次卧推表现。", evidence:"Health / WHOOP · 本地训练记录", scope:"只读", status:"recorded", reversible:false }
        ],
        lastAction: "打开今日首页",
        permission: "托管模式 · 日内低风险调整可自动执行",
        messages: [
          { role: "agent", text: "我已经读取今天的训练、最近两次卧推表现与昨晚恢复。你想执行、调整，还是先了解为什么这样安排？" }
        ],
        toast: null
      };

      const variantNames = {
        workbench: "Flip Workbench",
        briefing: "Daily Brief",
        console: "Training Console"
      };

      function statusbar() {
        return `<div class="statusbar"><span>9:41</span><div class="status-icons"><span class="signal"></span><span>5G</span><span class="battery"></span></div></div>`;
      }

      function workoutHero(compact = false) {
        return `
          <article class="hero-card"${compact ? ' style="min-height:246px"' : ""}>
            <div class="hero-top"><span class="program-chip">增肌 · 第 5 周</span><span class="tiny-chip"><i></i> 已就绪</span></div>
            <h3 class="hero-title">上肢推<br />力量日</h3>
            <div class="hero-meta">卧推主项 · 胸 / 肩 / 三头</div>
            <div class="hero-metrics">
              <div class="hero-metric"><strong>54′</strong><span>预计时长</span></div>
              <div class="hero-metric"><strong>17</strong><span>工作组</span></div>
              <div class="hero-metric"><strong>7.5</strong><span>目标 RPE</span></div>
            </div>
            <div class="hero-actions">
              <button class="primary-button" data-action="start-workout">开始训练</button>
              <button class="primary-button round-adjust" data-action="open-adjust" aria-label="调整今天的训练">⌁</button>
            </div>
          </article>`;
      }

      function todayPlan() {
        const plans = {
          strength: {
            mode: "tasks",
            label: "健身房 · 增肌第 5 周",
            frontTitle: "上肢推<br />力量日",
            subtitle: "卧推主项 · 胸 / 肩 / 三头",
            meta: "第 5 周 · 上肢推",
            metrics: [["54′","预计时长"],["17","工作组"],["RIR 2","主项目标"]],
            tasks: state.planTasks.strength,
            logs: state.timelineEvents,
            primary: "开始训练", primaryAction: "start-workout", secondary: "管理动作", secondaryAction: "manage-plan"
          },
          bodyweight: {
            mode: "tasks",
            label: "居家 · 徒手训练",
            frontTitle: "全身徒手<br />基础日",
            subtitle: "推 / 蹲 / 髋 / 核心 · 无器材",
            meta: "第 3 次 · 全身徒手",
            metrics: [["32′","预计时长"],["8","动作"],["RIR 3","目标余力"]],
            tasks: state.planTasks.bodyweight,
            logs: state.timelineEvents,
            primary: "开始训练", primaryAction: "start-workout", secondary: "管理动作", secondaryAction: "manage-plan"
          },
          cardio: {
            mode: "activity",
            label: "有氧 · 自由安排",
            frontTitle: "动一动，<br />按感觉来。",
            subtitle: "跑步、骑行或散步都可以",
            meta: "今天没有固定安排",
            metrics: [["自由","方式"],["不限","时长"],["轻松","建议强度"]],
            tasks: [],
            logs: state.timelineEvents,
            primary: "记录活动", primaryAction: "add-timeline", secondary: "自动整理", secondaryAction: "agent-fill-timeline"
          },
          rest: {
            mode: "activity",
            label: "休息日",
            frontTitle: "今天，<br />好好恢复。",
            subtitle: "完全休息，或者轻松走一走",
            meta: "恢复日",
            metrics: [["休息","今日安排"],["自由","轻松活动"],["明天","下次训练"]],
            tasks: [],
            logs: state.timelineEvents,
            primary: "记录今天", primaryAction: "add-timeline", secondary: "自动整理", secondaryAction: "agent-fill-timeline"
          }
        };
        return plans[state.planScenario];
      }

      function currentPlanTasks() {
        return state.planTasks[state.planScenario] || [];
      }

      function taskToExercise(task) {
        if (!task) return { name:"自由训练", reps:"8", load:"自选" };
        const match = String(task.scheme || "").match(/×\s*([^/]+)/);
        return { name:task.name, reps:match?.[1] || task.scheme || "自选", load:task.load || "自选" };
      }

      function combinedWorkoutCard() {
        const flipped = state.cardFace === "console";
        const plan = todayPlan();
        const faceTitle = "今日计划";
        const visibleItems = plan.tasks;
        const rows = visibleItems.length
          ? visibleItems.map((task,index) => `<div class="flip-console-row"><strong>${index + 1}. ${task.name}</strong><span>${task.scheme}</span><span class="${index === 0 ? "load-next" : ""}">${task.load}</span><button class="task-edit-button" data-edit-task="${index}" aria-label="编辑 ${task.name}">•••</button></div>`).join("")
          : `<div class="activity-empty"><b>今天没有固定安排</b><span>有活动时再记下来就好。</span></div>`;
        const listModeBar = `<div class="list-mode-bar"><strong>${plan.mode === "tasks" ? `${visibleItems.length} 个动作` : "今日安排"}</strong><span>${plan.mode === "tasks" ? plan.subtitle : "按状态决定"}</span></div>`;
        const actionPrimary = plan.mode === "tasks" ? [plan.primary, plan.primaryAction] : ["添加记录", "add-timeline"];
        const actionSecondary = plan.mode === "tasks" ? ["管理动作", "manage-plan"] : ["自动整理", "agent-fill-timeline"];
        const summary = `<article class="hero-card flip-front flip-live" data-face="summary"><div class="hero-top"><button class="program-chip" data-action="open-plan-scenarios">${plan.label} ▾</button><button class="flip-control" data-action="flip-card"><span>${plan.mode === "tasks" ? `${visibleItems.length} 个动作` : "查看安排"}</span><b>›</b></button></div><h3 class="hero-title">${plan.frontTitle}</h3><div class="hero-meta">${plan.subtitle}</div><div class="hero-metrics">${plan.metrics.map(metric => `<div class="hero-metric"><strong>${metric[0]}</strong><span>${metric[1]}</span></div>`).join("")}</div><div class="hero-actions"><button class="primary-button" data-action="${plan.primaryAction}">${state.workoutStatus === "in_progress" && plan.mode === "tasks" ? "继续训练" : plan.primary}</button><button class="primary-button round-adjust" data-action="open-plan-scenarios" aria-label="切换今日安排">⌁</button></div></article>`;
        const consoleFace = `<article class="flip-back flip-live" data-face="console"><div class="flip-back-head"><div><span class="scenario-label">${plan.label}</span><h3>${faceTitle}</h3><p>${plan.meta}</p></div><button class="flip-control" data-action="flip-card"><span>收起</span><b>‹</b></button></div><div class="flip-stats">${plan.metrics.map(metric => `<div class="flip-stat"><strong>${metric[0]}</strong><span>${metric[1]}</span></div>`).join("")}</div><div class="task-list-wrap ${!visibleItems.length ? "is-empty" : ""} ${visibleItems.length > 3 ? "is-scrollable" : ""}">${listModeBar}<div class="flip-console">${rows}</div></div><div class="flip-back-actions"><button class="primary-button dark" data-action="${actionPrimary[1]}">${state.workoutStatus === "in_progress" && plan.mode === "tasks" ? "继续训练" : actionPrimary[0]}</button><button class="secondary-button" data-action="${actionSecondary[1]}">${actionSecondary[0]}</button></div></article>`;
        return `<section class="workout-flip" aria-label="今日计划">${flipped ? consoleFace : summary}</section>`;
      }

      function changeCard() {
        if (!state.autoChangeApplied) return "";
        return `
          <article class="change-card" data-action="open-change-detail" role="button" tabindex="0">
            <div class="change-head"><div><span class="change-tag">今天有调整</span><h4>卧推改为 62.5 kg</h4></div><button class="undo-button" data-action="undo-change">恢复</button></div>
            <p>昨晚睡得少，今天先轻一点。</p>
          </article>`;
      }

      function scenarioCoachStatus() {
        if (["strength","bodyweight"].includes(state.planScenario)) return changeCard() || `<div class="metric-card wide"><div class="metric-label"><span>计划保持原样</span><span>v${state.planVersion}</span></div><p>刚才的自动调整已撤销。你仍可在训练前重新评估。</p></div>`;
        if (state.planScenario === "cardio") return `<div class="change-card" style="border-left-color:var(--lime-deep);background:#eef6d2;border-color:#d8e7a8"><div class="change-head"><div><span class="change-tag">自由活动</span><h4>今天没有固定目标</h4></div></div><p style="color:#596137">跑步、骑行或游泳都可以，按状态来。</p></div>`;
        return `<div class="change-card" style="border-left-color:var(--lime-deep);background:#eef6d2;border-color:#d8e7a8"><div class="change-head"><div><span class="change-tag">休息日</span><h4>今天好好恢复</h4></div></div><p style="color:#596137">完全休息，或者轻松走一走。</p></div>`;

      function coachAlert() {
        if (["strength","bodyweight"].includes(state.planScenario)) {

          return `<aside class="coach-alert"><span class="coach-alert-icon">↘</span><div class="coach-alert-copy"><small>训练建议</small><strong>${state.planScenario === "strength" ? "卧推改为 62.5 kg" : "分腿蹲少做 1 组"}</strong><span>${state.planScenario === "strength" ? "昨晚睡得少，今天轻一点" : "腿部恢复一般，今天少做一点"}</span></div><div class="coach-alert-actions"><button data-action="open-action-log">记录</button><button data-action="undo-change">恢复</button></div></aside>`;
        }
        return `<aside class="coach-alert pending"><span class="coach-alert-icon">＋</span><div class="coach-alert-copy"><small>待添加</small><strong>${state.planScenario === "cardio" ? "18:10 骑行了 37 分钟" : "20:10 步行了 29 分钟"}</strong><span>要加入今天的记录吗？</span></div><div class="coach-alert-actions"><button data-action="agent-fill-timeline" data-date="2026-08-08">查看</button><button data-action="confirm-agent-timeline" data-date="2026-08-08">加入</button></div></aside>`;
      }

      function timelineEventsMarkup(events) {
        return events.map(event => `<article class="timeline-event ${event.type === "训练" ? "training" : ""}" data-source="${event.source}"><time class="timeline-time">${event.time}</time><div class="timeline-event-card"><div class="timeline-event-head"><small>${event.type}</small></div><strong>${event.name}</strong><p>${event.detail}</p></div></article>`).join("");
      }

      function homeTimelineSection() {
        const events = [...state.timelineEvents].sort((a,b) => a.time.localeCompare(b.time));
        return `<section id="todayTimeline"><div class="section-head"><div><h3>今日记录</h3><span style="display:block;margin-top:5px">8 月 8 日 · ${events.length} 项</span></div><div class="timeline-tools"><button data-action="add-timeline" data-date="2026-08-08">＋ 添加</button><button data-action="agent-fill-timeline" data-date="2026-08-08">自动整理</button></div></div><div class="home-timeline">${timelineEventsMarkup(events)}</div></section>`;
      }

      function workbenchHome() {
        return `
          ${statusbar()}
          ${coachAlert()}
          ${combinedWorkoutCard()}
          ${homeTimelineSection()}`;
      }

      function dailyReportHome() {
        const observationCopy = state.coachObserved ? "动作识别覆盖 83% 的有效重复，未覆盖部分不会参与技术评分。" : "本次未开启骨架观测，因此日报只分析负荷、次数、RIR 与主观反馈，不生成动作技术评分。";
        const observationSignal = state.coachObserved ? `<div class="report-signal"><i>◇</i><div><strong>动作观测</strong><span>稳定重复 24 次 · 6 次置信度不足</span></div><b>不武断评分</b></div>` : `<div class="report-signal"><i>—</i><div><strong>动作观测</strong><span>本次未启用 Coach 摄像头模式</span></div><b>无技术结论</b></div>`;
        return `
