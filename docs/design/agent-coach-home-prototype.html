        return `<div class="overlay overlay-sheet" role="dialog" aria-modal="true" aria-label="整理今日记录"><section class="sheet"><div class="sheet-handle"></div><div class="sheet-head"><div><span class="change-tag">自动整理</span><h2>发现一项活动</h2></div><button class="icon-button" data-action="close-overlay" aria-label="关闭">×</button></div><p class="sheet-copy">${item[2]}</p><div class="proposal"><span class="proposal-kicker">${item[0]}</span><h3>${item[1]}</h3><div class="proposal-actions"><button class="primary-button dark" data-action="confirm-agent-timeline">加入记录</button><button class="secondary-button" data-action="open-chat">有问题</button></div></div></section></div>`;
      }

      function actionLogSheet() {
        const visible = state.actionLogFilter === "writes" ? state.actionLog.filter(item => item.type === "write") : state.actionLog;
        const writeCount = state.actionLog.filter(item => item.type === "write").length;
        const statusLabel = item => item.status === "undone" ? "已撤销" : item.type === "write" ? "已执行" : "已记录";
        const rows = visible.map(item => `<article class="audit-item ${item.type} ${item.status === "undone" ? "undone" : ""}"><div class="audit-item-head"><small>${item.time} · ${item.id} · ${item.scope}</small><span class="audit-status ${item.type === "write" ? item.status : "read"}">${statusLabel(item)}</span></div><h3>${item.title}</h3><p>${item.detail}</p>${item.before || item.after ? `<div class="audit-diff"><div><small>之前</small><strong>${item.before || "—"}</strong></div><b>→</b><div><small>之后</small><strong>${item.after || "—"}</strong></div></div>` : ""}<div class="audit-evidence">依据：${item.evidence || "由用户指令触发"}</div><div class="audit-foot"><span>MAXPOWER COACH · 本地审计链</span>${item.reversible ? `<button data-log-id="${item.id}" data-action="${item.status === "undone" ? "redo-agent-action" : "undo-agent-action"}">${item.status === "undone" ? "重新应用" : "撤销"}</button>` : ""}</div></article>`).join("");
        return `<section class="overlay audit-screen" role="dialog" aria-modal="true" aria-label="Coach 操作记录"><header class="chat-head"><button class="back-button" data-action="close-overlay" aria-label="返回">‹</button><div class="chat-head-title"><strong>Coach 操作记录</strong><span>APPEND-ONLY · LOCAL FIRST</span></div></header><div class="audit-body"><article class="audit-summary"><div><small>可追溯 · 可恢复</small><strong>每次操作都有来路</strong><p>读取与判断可追溯；写入保存前后差异，并可单独撤销。</p></div><span class="audit-count">${writeCount}</span></article><div class="audit-filters"><button class="${state.actionLogFilter === "all" ? "active" : ""}" data-log-filter="all">全部</button><button class="${state.actionLogFilter === "writes" ? "active" : ""}" data-log-filter="writes">有变更</button></div><div class="audit-list">${rows}</div></div></section>`;
      }

      function planManagerSheet() {
        const tasks = currentPlanTasks();
        return `<section class="overlay" role="dialog" aria-modal="true" aria-label="管理今日动作"><header class="chat-head"><button class="back-button" data-action="close-plan-manager" aria-label="返回">‹</button><div class="chat-head-title"><strong>今日计划</strong><span>${tasks.length} 个动作</span></div><button class="flip-control" data-action="add-plan-task">＋ 添加</button></header><div class="plan-manager-body"><div class="plan-manager-list">${tasks.map((task,index) => `<article class="plan-manager-row"><span class="plan-manager-index">${String(index + 1).padStart(2,"0")}</span><button class="plan-manager-copy" data-edit-task="${index}" style="border:0;background:transparent;padding:0;cursor:pointer"><strong>${task.name}</strong><span>${task.scheme} · ${task.load}</span></button><button class="plan-manager-edit" data-edit-task="${index}" aria-label="编辑 ${task.name}">•••</button></article>`).join("")}</div><button class="primary-button dark plan-manager-add" data-action="add-plan-task">＋ 添加动作</button></div></section>`;
      }

      function planTaskEditorSheet() {
        const task = state.editingTaskIndex === null ? {name:"",scheme:"3×10",load:"自选"} : currentPlanTasks()[state.editingTaskIndex];
        const editing = state.editingTaskIndex !== null;
        return `<div class="overlay overlay-sheet" role="dialog" aria-modal="true" aria-label="${editing ? "编辑动作" : "添加动作"}"><section class="sheet"><div class="sheet-handle"></div><div class="sheet-head"><div><span class="change-tag">今日计划</span><h2>${editing ? "编辑动作" : "添加动作"}</h2></div><button class="icon-button" data-action="back-to-plan-manager" aria-label="关闭">×</button></div><form id="planTaskForm" class="field-stack" style="margin-top:16px"><label>动作<input name="name" value="${task?.name || ""}" placeholder="例如：杠铃卧推" required/></label><label>组数与次数<input name="scheme" value="${task?.scheme || "3×10"}" placeholder="例如：4×8" required/></label><label>重量或提示<input name="load" value="${task?.load || "自选"}" placeholder="例如：62.5 kg" required/></label><button class="primary-button dark" type="submit">${editing ? "保存修改" : "加入计划"}</button></form>${editing ? `<button class="danger-button" data-action="delete-plan-task">从计划中删除</button>` : ""}</section></div>`;
      }

      function exerciseLibrarySheet() {
        const target = state.exerciseSwapTarget;
        const nextSetMode = target === "__next_set__";
        const actionLabel = nextSetMode ? "选择" : target ? "替换" : "查看";
        return `<section class="overlay" role="dialog" aria-modal="true" aria-label="动作库"><header class="chat-head"><button class="back-button" data-action="${nextSetMode ? "back-to-next-set" : "close-overlay"}" aria-label="返回">‹</button><div class="chat-head-title"><strong>${nextSetMode ? "选择下一组动作" : target ? `替换 ${target}` : "动作库"}</strong><span>64 个动作</span></div><button class="flip-control" data-action="new-exercise">＋ 新增</button></header><div class="chat-body" style="padding-bottom:24px"><input class="library-search" aria-label="搜索动作" placeholder="搜索肌群、器材或动作名称…"/><div class="exercise-list">${state.customExerciseAdded ? `<article class="exercise-item"><span class="exercise-glyph">自</span><div><strong>单臂地雷管推举</strong><span>用户自建 · 肩部 · 杠铃</span></div><button data-replace="单臂地雷管推举">${actionLabel}</button></article>` : ""}<article class="exercise-item"><span class="exercise-glyph">械</span><div><strong>上斜器械推</strong><span>上胸 · 固定器械 · 推</span></div><button data-replace="上斜器械推">${actionLabel}</button></article><article class="exercise-item"><span class="exercise-glyph">哑</span><div><strong>上斜哑铃推</strong><span>上胸 · 哑铃 · 推</span></div><button data-replace="上斜哑铃推">${actionLabel}</button></article><article class="exercise-item"><span class="exercise-glyph">俯</span><div><strong>负重俯卧撑</strong><span>胸部 · 自重/杠铃片 · 推</span></div><button data-replace="负重俯卧撑">${actionLabel}</button></article><article class="exercise-item"><span class="exercise-glyph">地</span><div><strong>地板卧推</strong><span>胸/三头 · 杠铃 · 水平推</span></div><button data-replace="地板卧推">${actionLabel}</button></article></div></div></section>`;
      }

      function newExerciseSheet() {
        return `<div class="overlay overlay-sheet" role="dialog" aria-modal="true" aria-label="新增自定义动作"><section class="sheet"><div class="sheet-handle"></div><div class="sheet-head"><div><span class="change-tag">动作库</span><h2>新增动作</h2></div><button class="icon-button" data-action="close-overlay" aria-label="关闭">×</button></div><form id="newExerciseForm" class="field-stack"><label>动作名称<input name="name" value="单臂地雷管推举" required/></label><label>主要肌群<select name="muscle"><option>肩部</option><option>胸部</option><option>背部</option><option>下肢</option></select></label><label>器材<select name="equipment"><option>杠铃</option><option>哑铃</option><option>固定器械</option><option>自重</option></select></label><button class="primary-button dark" type="submit">保存</button></form></section></div>`;
      }

      function capabilitySheet() {
        return `<div class="overlay overlay-sheet" role="dialog" aria-modal="true" aria-label="教练快捷入口"><section class="sheet"><div class="sheet-handle"></div><div class="sheet-head"><div><span class="change-tag">快捷操作</span><h2>需要帮忙吗？</h2></div><button class="icon-button" data-action="close-overlay" aria-label="关闭">×</button></div><div class="capability-grid">
          <button class="capability-button" data-action="open-adjust"><i>↕</i><div><strong>调整今天</strong><span>时间、器材、疲劳与疼痛约束</span></div></button>
          <button class="capability-button" data-action="open-free-log"><i>＋</i><div><strong>记录训练</strong><span>计划外训练或快速补录</span></div></button>
          <button class="capability-button" data-capability="recovery"><i>◔</i><div><strong>解释恢复</strong><span>把睡眠与负荷翻译成建议</span></div></button>
          <button class="capability-button" data-capability="plan"><i>⌗</i><div><strong>规划目标</strong><span>训练、饮食和恢复的完成路径</span></div></button>
        </div></section></div>`;
      }

      function freeLogSheet() {
        return `<div class="overlay overlay-sheet" role="dialog" aria-modal="true" aria-label="自由训练"><section class="sheet"><div class="sheet-handle"></div><div class="sheet-head"><div><span class="change-tag">记录训练</span><h2>自由训练</h2></div><button class="icon-button" data-action="close-overlay" aria-label="关闭">×</button></div><div class="choice-list"><button class="choice-button" data-action="mock-log"><div><strong>添加动作</strong><span>重量、次数和余力</span></div><b>＋</b></button><button class="choice-button" data-action="mock-log"><div><strong>复制上次训练</strong><span>继续使用最近的动作和重量</span></div><b>↻</b></button><button class="choice-button" data-action="mock-log"><div><strong>边练边记</strong><span>训练中随时添加或替换动作</span></div><b>›</b></button></div></section></div>`;
      }

      function proposalMarkup() {
        if (!state.proposal) return "";
        return `<article class="proposal"><span class="proposal-kicker">计划变更预览 · 尚未执行</span><h3>${state.proposal.title}</h3><div class="diff"><div><small>原安排</small><strong>${state.proposal.before}</strong></div><div class="diff-arrow">→</div><div><small>建议</small><strong>${state.proposal.after}</strong></div></div><p class="evidence">依据：${state.proposal.evidence}</p><div class="proposal-actions"><button class="primary-button dark" data-action="apply-proposal">应用这次调整</button><button class="secondary-button" data-action="keep-plan">保持原计划</button><button class="text-button" data-action="focus-chat">继续讨论</button></div></article>`;
      }

      function coachCardMarkup(card) {
        if (card.type === "plan") return `<article class="coach-output-card accent"><div class="output-card-head"><span>今日计划</span><b>${card.meta || `v${state.planVersion}`}</b></div><h3>${card.title}</h3><p>${card.subtitle}</p><div class="output-metrics"><div class="output-metric"><strong>54′</strong><span>预计时长</span></div><div class="output-metric"><strong>17</strong><span>工作组</span></div><div class="output-metric"><strong>RIR 2</strong><span>主项目标</span></div></div><div class="output-card-actions"><button data-action="ask-plan-reason">这样安排的原因</button><button class="primary" data-action="open-plan-from-drawer">查看动作</button></div><div class="output-source"><span>计划 · 历史表现 · 恢复状态</span><span>可修改</span></div></article>`;
        if (card.type === "progress") return `<article class="coach-output-card accent"><div class="output-card-head"><span>目标路径</span><b>每周更新</b></div><h3>减脂路径仍在目标区间</h3><p>目前不需要继续降低热量，训练表现也没有出现持续下降。</p><div class="output-metrics"><div class="output-metric"><strong>-0.4</strong><span>KG / 周</span></div><div class="output-metric"><strong>11–14</strong><span>预计剩余周</span></div><div class="output-metric"><strong>+4.2%</strong><span>卧推表现</span></div></div><div class="output-card-actions"><button data-action="show-agent-card" data-card="sources">查看依据</button><button class="primary" data-view="progress">打开进展</button></div></article>`;
        if (card.type === "sources") return `<article class="coach-output-card"><div class="output-card-head"><span>资料与依据</span><b>4 个来源</b></div><h3>这次判断用了什么</h3><p>最近 28 天体重趋势、腰围、训练完成率与卧推 e1RM。单日体重不会触发计划调整。</p><div class="output-source"><span>Health · 体脂秤 · 训练记录 · 用户反馈</span><span>09:41</span></div></article>`;
        if (card.type === "report") return `<article class="coach-output-card"><div class="output-card-head"><span>训练报告</span><b>今日完成</b></div><h3>主项完成，推进成立</h3><p>17 / 17 工作组 · 平均 RIR 1.8；动作识别只覆盖高置信度重复。</p><div class="output-metrics"><div class="output-metric"><strong>8,780</strong><span>总负荷 KG</span></div><div class="output-metric"><strong>83%</strong><span>有效观测</span></div><div class="output-metric"><strong>52′</strong><span>实际时长</span></div></div><div class="output-card-actions"><button data-action="show-agent-card" data-card="sources">查看资料</button><button class="primary" data-action="open-action-log">操作记录</button></div></article>`;
        return "";
      }

      function trainingCoachCards() {
        if (state.trainingCoachCard === "set-report") return `<article class="coach-output-card accent"><div class="output-card-head"><span>第 ${Math.max(state.completedSets,1)} 组完成</span><b>骨架 + 记录</b></div><h3>8 次有效，后两次肩部略前移</h3><p>本组动作稳定度较好；末次实际余力约 1，比目标更接近力竭。</p><div class="output-metrics"><div class="output-metric"><strong>8</strong><span>确认次数</span></div><div class="output-metric"><strong>86%</strong><span>动作稳定</span></div><div class="output-metric"><strong>RIR 1</strong><span>实际余力</span></div></div><div class="output-source"><span>33 点骨架 · 有效帧 94% · 用户记录</span><span>高置信度</span></div></article><article class="coach-output-card warn"><div class="output-card-head"><span>下一组建议</span><b>尚未应用</b></div><h3>降低 2.5 kg，保持 8 次</h3><p>只影响下一组，不修改后续计划。</p><div class="output-diff"><div><small>当前</small><strong>62.5 kg × 8</strong></div><b>→</b><div><small>建议</small><strong>60 kg × 8</strong></div></div><div class="output-card-actions"><button data-action="keep-training-set">保持原安排</button><button class="primary" data-action="apply-training-adjustment">应用到下一组</button></div></article>`;
        return `<article class="coach-output-card accent"><div class="output-card-head"><span>实时动作建议</span><b>REP 06</b></div><div style="padding:10px 12px 3px" class="live-cue"><i>✓</i><div><strong>下放稳定，继续保持当前节奏</strong><span>右肘轨迹正常 · 杠铃路径稳定</span></div><b>91%</b></div><div class="output-source"><span>骨架识别 · 本地推理 · 未上传</span><span>高置信度</span></div></article><article class="coach-output-card"><div class="output-card-head"><span>当前组</span><b>${state.activeExercise.name}</b></div><h3>${state.activeExercise.load} × ${state.activeExercise.reps} 次</h3><p>目标 RIR 2 · 已确认 6 次。训练中只给提示，计划变更排到下一组。</p><div class="output-card-actions"><button data-action="mock-voice">告诉 Coach 体感</button><button class="primary" data-action="edit-next-set">调整下一组</button></div></article>`;
      }

      function coachDrawer() {
        if (state.coachDrawer === "closed") return "";
        const training = state.coachSurface === "training" && state.overlay === "session";
        const allowed = ["today","plan","progress"].includes(state.view);
        if (!training && !allowed) return "";
        const full = state.coachDrawer === "full";
        const contextTitle = training ? `${state.activeExercise.name} · 第 ${Math.min(state.completedSets + 1,17)} 组` : state.workoutStatus === "complete" ? "今日训练报告" : state.view === "progress" ? "长期目标与趋势" : state.view === "plan" ? `${state.selectedDay} 日程` : "今日训练与恢复";
        const contextMeta = training ? "实时骨架已连接" : `计划 v${state.planVersion}`;
        const messages = state.messages.slice(-5).map(m => `<div class="drawer-message ${m.role}">${m.text}</div>`).join("");
        const cards = training ? trainingCoachCards() : state.coachCards.map(coachCardMarkup).join("");
        const prompts = training
          ? `<button data-prompt="这组动作怎么样？">这组怎么样？</button><button data-prompt="我右肩有点紧">右肩有点紧</button><button data-action="edit-next-set">调整下一组</button>`
          : `<button data-action="show-agent-card" data-card="plan">今日计划</button><button data-action="show-agent-card" data-card="progress">目标进展</button><button data-action="show-agent-card" data-card="sources">查看依据</button>`;
        return `<button class="coach-drawer-backdrop" data-action="minimize-coach-drawer" aria-label="收起 Coach"></button><section class="coach-drawer ${training ? "training" : "general"} ${full ? "full" : "half"}" role="dialog" aria-label="MaxPower Coach 对话抽屉"><button class="drawer-grab" data-action="toggle-drawer-size" aria-label="${full ? "收回" : "展开全屏"}"></button><header class="drawer-head"><span class="drawer-agent-mark">⚡</span><div class="drawer-title"><strong>MaxPower Coach</strong><span>${state.chatContext} · 对话保持中</span></div><div class="drawer-head-actions">${training ? `<button class="end-set-mini" data-action="complete-set">结束本组</button>` : ""}<button data-action="toggle-drawer-size" aria-label="切换抽屉高度">${full ? "↘" : "↗"}</button><button data-action="minimize-coach-drawer" aria-label="收起">—</button></div></header><div class="drawer-context"><i></i><strong>${contextTitle}</strong><span>${contextMeta}</span></div><div class="drawer-body"><div class="drawer-messages">${messages}${cards}${proposalMarkup()}</div></div><div class="drawer-composer"><div class="drawer-prompts">${prompts}</div><form class="drawer-input-row" id="chatForm"><button class="voice-button ${state.voiceListening ? "listening" : ""}" type="button" data-action="mock-voice" aria-label="语音输入">${state.voiceListening ? "●" : "⌁"}</button><input id="chatInput" aria-label="给教练发消息" placeholder="${training ? "说说体感，或问当前动作…" : "问计划、进展或恢复…"}" autocomplete="off"/><button class="drawer-send" type="submit" aria-label="发送">↑</button></form></div>${training ? "" : navTabsMarkup("drawer-nav")}</section>`;
      }

      function nextSetSheet() {
        const next = state.nextSetOverride || state.activeExercise;
        const tasks = currentPlanTasks();
        const customOption = tasks.some(task => task.name === next.name) ? "" : `<option value="${next.name}" data-load="${next.load}" data-reps="${next.reps}" selected>${next.name}</option>`;
        return `<div class="overlay overlay-sheet" role="dialog" aria-modal="true" aria-label="调整下一组"><section class="sheet"><div class="sheet-handle"></div><div class="sheet-head"><div><span class="change-tag">下一组</span><h2>临时调整</h2></div><button class="icon-button" data-action="back-to-session" aria-label="关闭">×</button></div><form id="nextSetForm" class="field-stack" style="margin-top:16px"><label>动作<select name="name" id="nextExerciseSelect">${customOption}${tasks.map(task => `<option value="${task.name}" data-load="${task.load}" data-reps="${taskToExercise(task).reps}" ${task.name === next.name ? "selected" : ""}>${task.name}</option>`).join("")}</select></label><label>重量或提示<input name="load" id="nextSetLoad" value="${next.load}" required/></label><label>次数<input name="reps" id="nextSetReps" value="${next.reps}" required/></label><button class="primary-button dark" type="submit">保存下一组</button></form><button class="secondary-button" style="width:100%;margin-top:9px" data-action="open-next-set-library">从动作库选择</button>${state.nextSetOverride ? `<button class="danger-button" data-action="clear-next-set">恢复原安排</button>` : ""}</section></div>`;
      }

      function sessionOverlay() {
        const guided = state.coachMode === "guided";
        const next = state.nextSetOverride || state.activeExercise;
        const logBody = `<article class="log-session-card"><span class="report-kicker">摄像头已关闭</span><h2>${state.activeExercise.name}</h2><p>第 ${Math.min(state.completedSets + 1, 17)} 工作组 · 目标 RIR 2</p><div class="log-inputs"><div class="log-input"><span>重量</span><strong>${state.activeExercise.load}</strong></div><div class="log-input"><span>次数</span><strong>${state.activeExercise.reps}</strong></div><div class="log-input"><span>RIR</span><strong>2</strong></div></div></article>`;
        const nextCard = `<article class="next-set-card ${state.nextSetOverride ? "changed" : ""}"><small>下一组${state.nextSetOverride ? " · 已调整" : ""}</small><strong>${next.name}</strong><span>${next.load} × ${next.reps} 次</span><button data-action="edit-next-set">调整</button></article>`;
        if (guided) {

ion="open-training-coach" aria-label="打开实时 Coach">⚡</button></div></div></section>`;

      function changeDetailSheet() {
        return `<div class="overlay overlay-sheet" role="dialog" aria-modal="true" aria-label="训练调整详情"><section class="sheet"><div class="sheet-handle"></div><div class="sheet-head"><div><span class="change-tag">今日调整</span><h2>卧推轻一点</h2></div><button class="icon-button" data-action="close-overlay">×</button></div><p class="sheet-copy">上次最后两组没有完成目标次数，昨晚也比平时少睡了 48 分钟。今天先用 62.5 kg，下周计划不变。</p><div class="diff"><div><small>原计划</small><strong>65 kg × 8</strong></div><div class="diff-arrow">→</div><div><small>今天</small><strong>62.5 kg × 8</strong></div></div><div class="proposal-actions" style="margin-top:14px"><button class="secondary-button" data-action="undo-change">恢复原计划</button><button class="text-button" data-action="open-chat">问问教练</button></div></section></div>`;

      function profileSheet() {
        return `<div class="overlay overlay-sheet" role="dialog" aria-modal="true" aria-label="Coach 控制方式"><section class="sheet"><div class="sheet-handle"></div><div class="sheet-head"><div><span class="change-tag">数据与执行权限</span><h2>Coach 控制方式</h2></div><button class="icon-button" data-action="close-overlay">×</button></div><p class="sheet-copy">核心训练记录和规则引擎可完全离线；云端用于跨设备同步和更强模型，不是基础功能的前置条件。</p><div class="choice-list"><button class="choice-button" data-permission="managed"><div><strong>托管模式 · 当前</strong><span>低风险自动执行并可撤销；长期/高影响先预览</span></div><b>✓</b></button><button class="choice-button" data-permission="confirm"><div><strong>每次确认</strong><span>所有计划写入都先确认</span></div><b>○</b></button><button class="choice-button" data-permission="advice"><div><strong>只给建议</strong><span>Agent 不直接改计划</span></div><b>○</b></button></div></section></div>`;
      }

      function renderOverlay() {
        if (state.overlay === "adjust") return adjustSheet();
        if (state.overlay === "start-mode") return startModeSheet();
        if (state.overlay === "plan-scenarios") return planScenarioSheet();
        if (state.overlay === "timeline-log") return activityLogSheet();
        if (state.overlay === "agent-timeline") return agentActivitySheet();
        if (state.overlay === "action-log") return actionLogSheet();
        if (state.overlay === "plan-manager") return planManagerSheet();
        if (state.overlay === "plan-task-editor") return planTaskEditorSheet();
        if (state.overlay === "library") return exerciseLibrarySheet();
        if (state.overlay === "new-exercise") return newExerciseSheet();
        if (state.overlay === "capabilities") return capabilitySheet();
        if (state.overlay === "free-log") return freeLogSheet();
        if (state.overlay === "session") return sessionOverlay();
        if (state.overlay === "next-set") return nextSetSheet();
        if (state.overlay === "change-detail") return changeDetailSheet();
        if (state.overlay === "profile") return profileSheet();

      function render() {
        const hadCoachDrawer = Boolean(document.querySelector(".coach-drawer"));
        let content;
        if (state.view === "plan") content = planPage();
        else if (state.view === "progress") content = progressPage();
        else if (state.view === "me") content = mePage();
        else if (state.workoutStatus === "complete") content = dailyReportHome();
        else if (state.variant === "briefing") content = briefingHome();
        else if (state.variant === "console") content = consoleHome();
        else content = workbenchHome();
        const agentEnabled = ["today","plan","progress"].includes(state.view);
        document.querySelector("#app").innerHTML = `<div class="screen ${agentEnabled ? "" : "nav-only"}"${state.overlay ? ' aria-hidden="true" inert' : ""}>${content}</div>${dock()}${renderOverlay()}${coachDrawer()}${state.toast ? `<div class="toast">${state.toast}</div>` : ""}`;
        const nextCoachDrawer = document.querySelector(".coach-drawer");
        if (!hadCoachDrawer && nextCoachDrawer) {
          nextCoachDrawer.classList.add("is-entering");
          const nextBackdrop = document.querySelector(".coach-drawer-backdrop");
          nextBackdrop?.classList.add("is-entering");
          const finishCoachEntrance = event => {
            if (event.target !== nextCoachDrawer || event.animationName !== "coachBubbleOpen") return;
            nextCoachDrawer.removeEventListener("animationend", finishCoachEntrance);
            nextCoachDrawer.classList.remove("is-entering");
            nextBackdrop?.classList.remove("is-entering");
          };
          nextCoachDrawer.addEventListener("animationend", finishCoachEntrance);
        }
        document.querySelectorAll("[data-variant]").forEach(btn => btn.classList.toggle("active", btn.dataset.variant === state.variant));
        document.querySelector("#variantTitle").innerHTML = variantNames[state.variant].replace(" ", "<br />");
        renderState();
      }

      function minimizeCoachDrawer() {
        const drawer = document.querySelector(".coach-drawer");
        const backdrop = document.querySelector(".coach-drawer-backdrop");
        const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const finish = () => {
          state.coachDrawer = "closed";
          state.voiceListening = false;
          state.lastAction = "收起 Coach 抽屉并保留对话";
          render();
        };
        if (!drawer || reduceMotion) { finish(); return; }
        if (drawer.classList.contains("is-closing")) return;
        drawer.classList.remove("is-entering");
        backdrop?.classList.remove("is-entering");
        drawer.classList.add("is-closing");
        backdrop?.classList.add("is-closing");
        window.setTimeout(finish, 350);
      }

      function renderState() {
        const rows = [
          ["UI 方案", variantNames[state.variant]],
          ["当前页面", state.overlay ? `overlay:${state.overlay}` : state.view],
          ["训练状态", state.workoutStatus],
          ["训练模式", state.coachMode || "尚未选择"],
          ["Coach 抽屉", `${state.coachDrawer} · ${state.coachSurface}`],
          ["骨架数据", state.coachObserved ? "存在部分高置信度观测" : "无"],
          ["核心卡片", state.workoutStatus === "complete" ? "今日日报" : state.cardFace],
          ["动作替换", state.replacementName],
          ["计划动作", `${currentPlanTasks().length} 个`],
          ["下一组", state.nextSetOverride ? `${state.nextSetOverride.name} · 已调整` : `${state.activeExercise.name} · 原安排`],
          ["Timeline 事件", `${state.timelineEvents.length} 条 · 多源汇聚`],
          ["Agent Action Log", `${state.actionLog.length} 条 · ${state.actionLog.filter(item => item.type === "write" && item.status === "applied").length} 个生效变更`],
          ["计划版本", `v${state.planVersion}`],
          ["执行权限", state.permission.split(" · ")[0]],
          ["自动调整", state.autoChangeApplied ? "已执行，可撤销" : "未应用"],
          ["待确认变更", state.proposal ? state.proposal.title : "无"],
          ["最近操作", state.lastAction]
        ];
        document.querySelector("#stateBox").innerHTML = rows.map(row => `<div class="state-row"><span>${row[0]}</span><span>${row[1]}</span></div>`).join("");
      }

      function notify(message) {
        state.toast = message;
        render();
        window.clearTimeout(notify.timer);
        notify.timer = window.setTimeout(() => { state.toast = null; render(); }, 1900);
      }

      function recordAgentAction(entry) {
        const id = `ACT-${state.actionLogSequence++}`;
        const item = { id, time:"09:41", status:"recorded", reversible:false, scope:"当前会话", ...entry };
        state.actionLog.unshift(item);
        return item;
      }

      function restoreAgentAction(id, direction) {
        const item = state.actionLog.find(log => log.id === id);
        if (!item || !item.reversible) return;
        const applying = direction === "redo";
        if (item.target === "auto-adjust") { state.autoChangeApplied = applying; state.planTasks.strength[0].load = applying ? "62.5 kg" : "65 kg"; if (state.workoutStatus === "planned") state.activeExercise.load = state.planTasks.strength[0].load; }
        if (item.target === "timeline") {
          const target = editableTimeline(item.targetDate);
          const index = target.findIndex(event => event.name === item.event?.name);
          if (!applying && item.previousEvent && index >= 0) target[index] = { ...item.previousEvent };
          else if (!applying && index >= 0) target.splice(index, 1);
          if (applying && index >= 0 && item.event) target[index] = { ...item.event };
          else if (applying && index < 0 && item.event) target.push({ ...item.event });
        }
        if (item.target === "plan-proposal") state.planVersion = applying ? item.versionAfter : item.versionBefore;
        if (item.target === "next-set") state.nextSetOverride = applying ? { ...item.nextOverride } : item.previousNext ? { ...item.previousNext } : null;
        item.status = applying ? "applied" : "undone";
        recordAgentAction({ type:"write", title:`${applying ? "重新应用" : "撤销"}：${item.title}`, detail:`${applying ? "重新执行已保存的变更" : "使用操作前快照恢复状态"}。`, before:applying ? "已撤销" : "已执行", after:applying ? "已执行" : "已撤销", evidence:`关联操作 ${item.id}；原记录保持不变。`, scope:"恢复操作", status:"applied", reversible:false });
        state.lastAction = `${applying ? "重新应用" : "撤销"} Agent 操作：${item.title}`;
        state.overlay = "action-log";
        notify(applying ? "已重新应用" : "已恢复到操作前");
      }

      function openChat(context = "今日训练") {
        const training = state.overlay === "session" && state.workoutStatus === "in_progress";
        state.chatContext = context;
        state.coachSurface = training ? "training" : "general";
        state.coachDrawer = "half";
        if (!training) state.overlay = null;
        state.lastAction = `展开 Coach 抽屉：${context}`;
        render();
        requestAnimationFrame(() => document.querySelector("#chatInput")?.focus());
      }

      function createProposal(kind) {
        const proposals = {
          time: { title: "压缩为 30 分钟版本", before: "5 动作 · 17 组", after: "3 动作 · 10 组", evidence: "保留卧推全部主项组；用超级组压缩胸肩三头附件训练。" },
          equipment: { title: "替代被占用器材", before: "上斜哑铃推", after: "上斜器械推", evidence: "同一动作模式；器械可用；根据历史表现换算为 45 kg × 10。" },
          fatigue: { title: "切换为恢复优先版本", before: "目标 RPE 7.5", after: "目标 RPE 6.5", evidence: "这是一条临时降级建议。开始热身后还会根据实际速度和 RIR 再判断。" }
        };
        state.proposal = proposals[kind];
        state.messages.push({ role: "user", text: kind === "time" ? "我今天只有 30 分钟。" : kind === "equipment" ? "上斜哑铃区现在用不了。" : "我今天明显比平时疲劳。" });
        state.messages.push({ role: "agent", text: "我做了一版只影响今天的调整。先看具体差异；应用后仍可撤销。" });
        state.overlay = null;
        state.coachSurface = "general";
        state.coachDrawer = "half";
        state.chatContext = "今日训练调整";
        state.lastAction = `生成变更预览：${state.proposal.title}`;
        recordAgentAction({ type:"decision", title:`生成草稿：${state.proposal.title}`, detail:"只生成可审阅的变更预览，尚未写入今日计划。", before:state.proposal.before, after:state.proposal.after, evidence:state.proposal.evidence, scope:"计划草稿" });
        render();
      }

      function handleMessage(raw) {
        const text = raw.trim();
        if (!text) return;
        state.messages.push({ role: "user", text });
        state.proposal = null;
        if (/30|半小时|时间/.test(text)) {
          state.messages.push({ role: "agent", text: "可以。我会优先保留主项有效组，把附件动作合并；这是临时调整，不会破坏周计划。" });
          state.proposal = { title: "压缩为 30 分钟版本", before: "5 动作 · 17 组", after: "3 动作 · 10 组", evidence: "保留卧推 4 个主项组；附件组按肌群周量优先级裁剪。" };
        } else if (/肩|痛|不舒服/.test(text)) {
          state.messages.push({ role: "agent", text: "先不继续加负荷。请标记疼痛位置、强度和是否在热身中加剧；在信息不足前，我只会建议安全降级，不会做医疗诊断。" });
        } else if (/为什么|减重量/.test(text)) {
          state.messages.push({ role: "agent", text: "上次同重量末两组掉到 7 和 6 次，末组 RIR 0；昨晚睡眠又低于基线。今天减 2.5 kg 是为了守住 4×8 和动作质量，不代表能力退步。" });
        } else {
          state.messages.push({ role: "agent", text: "我已把这条信息放进今天的训练上下文。目前还没有足够依据直接改计划；你可以补充时间、器材、疲劳或疼痛情况。" });
        }
        state.lastAction = `Coach 回答：${text.slice(0, 18)}`;
        recordAgentAction({ type:"decision", title:"分析用户输入并给出回应", detail:`用户输入：${text.slice(0, 28)}${text.length > 28 ? "…" : ""}`, evidence:state.proposal ? `同时生成草稿：${state.proposal.title}` : "本次未执行任何数据写入。", scope:"对话" });
        render();
      }

      function flipWorkoutCard() {
        if (state.flipping) return;
        state.flipping = true;
        const face = document.querySelector(".flip-live");
        const scrollTop = document.querySelector(".screen")?.scrollTop || 0;
        face?.classList.add("card-flip-out");
        window.setTimeout(() => {
          state.cardFace = state.cardFace === "summary" ? "console" : "summary";
          state.lastAction = state.cardFace === "console" ? "翻转卡片：查看今日计划" : "翻转卡片：返回工作台概览";
          render();
          const nextFace = document.querySelector(".flip-live");
          const screen = document.querySelector(".screen");
          if (screen) screen.scrollTop = scrollTop;
          nextFace?.classList.add("card-flip-in");
          window.setTimeout(() => { state.flipping = false; }, 360);
        }, 190);
      }

      document.addEventListener("click", event => {
        const variant = event.target.closest("[data-variant]");
        if (variant) {
          state.variant = variant.dataset.variant;
          state.view = "today";
          state.overlay = null;
          state.lastAction = `切换 UI 方案：${variantNames[state.variant]}`;
          const next = new URL(location.href); next.searchParams.set("v", state.variant); history.replaceState({}, "", next);
          render(); return;
        }

        const view = event.target.closest("[data-view]");
        if (view) { state.view = view.dataset.view; state.overlay = null; state.lastAction = `切换主导航：${state.view}`; render(); return; }

        const calendarDay = event.target.closest("[data-calendar-day]");
        if (calendarDay) { state.selectedDay = calendarDay.dataset.calendarDay; state.lastAction = `查看计划日历：${state.selectedDay}`; render(); return; }

        const calendarMode = event.target.closest("[data-calendar-mode]");
        if (calendarMode) { state.calendarMode = calendarMode.dataset.calendarMode; state.lastAction = `切换日历视图：${state.calendarMode}`; render(); return; }

        const planScenario = event.target.closest("[data-plan-scenario]");
        if (planScenario) { state.planScenario = planScenario.dataset.planScenario; state.cardListView = ["strength","bodyweight"].includes(state.planScenario) ? "tasks" : "timeline"; state.cardFace = "console"; state.overlay = null; state.lastAction = `切换今日场景：${state.planScenario}`; render(); return; }

        const listView = event.target.closest("[data-list-view]");
        if (listView) { state.cardListView = listView.dataset.listView; state.lastAction = `卡片切换：${state.cardListView}`; render(); return; }

        const range = event.target.closest("[data-range]");
        if (range) { state.progressRange = range.dataset.range; state.lastAction = `切换长期趋势范围：${state.progressRange}`; render(); return; }

        const mode = event.target.closest("[data-mode]");
        if (mode) { state.coachMode = mode.dataset.mode; state.coachDrawer = "closed"; state.coachSurface = "training"; state.trainingCoachCard = "live"; if (state.coachMode === "guided") state.coachObserved = true; state.workoutStatus = "in_progress"; state.activeExercise = taskToExercise(currentPlanTasks()[0]); state.nextSetOverride = null; state.overlay = "session"; state.lastAction = state.coachMode === "guided" ? "进入 Coach 监控与分析模式" : "进入仅记录模式"; render(); return; }

        const taskEdit = event.target.closest("[data-edit-task]");
        if (taskEdit) { state.editingTaskIndex = Number(taskEdit.dataset.editTask); state.overlay = "plan-task-editor"; state.lastAction = `编辑计划动作：${currentPlanTasks()[state.editingTaskIndex]?.name || "动作"}`; render(); return; }

        const replacement = event.target.closest("[data-replace]");
        if (replacement) {
          if (state.exerciseSwapTarget === "__next_set__") { const name = replacement.dataset.replace; const planned = currentPlanTasks().find(task => task.name === name); const defaults = {"上斜器械推":{load:"45 kg",reps:"10"},"负重俯卧撑":{load:"10 kg",reps:"12"},"地板卧推":{load:"55 kg",reps:"8"},"单臂地雷管推举":{load:"20 kg",reps:"10"}}; state.nextSetOverride = planned ? taskToExercise(planned) : {name,...(defaults[name] || {load:"自选",reps:"10"})}; state.exerciseSwapTarget = null; state.overlay = "next-set"; state.lastAction = `下一组选择动作：${name}`; notify("已选择动作"); return; }
          if (!state.exerciseSwapTarget) { state.lastAction = `查看动作：${replacement.dataset.replace}`; notify("已打开动作详情"); return; }
          state.replacementName = replacement.dataset.replace;
          state.replacementApplied = true;
          state.planVersion += 1;
          state.overlay = null;
          state.cardFace = "console";
          state.lastAction = `将 ${state.exerciseSwapTarget} 替换为 ${state.replacementName}`;
          state.exerciseSwapTarget = null;
          notify(`动作已替换 · 计划 v${state.planVersion}`);
          return;
        }

        const adjust = event.target.closest("[data-adjust]");
        if (adjust) {
          if (adjust.dataset.adjust === "other") openChat("今日训练 · 自定义约束");
          else createProposal(adjust.dataset.adjust);
          return;
        }

        const prompt = event.target.closest("[data-prompt]");
        if (prompt) { handleMessage(prompt.dataset.prompt); return; }

        const capability = event.target.closest("[data-capability]");
        if (capability) {
          if (capability.dataset.capability === "recovery") {
            state.messages.push({ role: "agent", text: "恢复 72 代表今天可以训练，但不等于适合冲极限。我会把睡眠、近期训练负荷和热身表现合在一起解释，而不是把单个分数当命令。" });
            openChat("恢复与睡眠");
          } else openChat("目标路径 · 训练 / 饮食 / 恢复");
          return;
        }

        const permission = event.target.closest("[data-permission]");
        if (permission) {
          const values = { managed: "托管模式 · 日内低风险调整可自动执行", confirm: "每次确认 · 所有写入先预览", advice: "只给建议 · Agent 不写入计划" };
          state.permission = values[permission.dataset.permission];
          state.lastAction = `更新权限：${state.permission}`;
          state.overlay = null;
          notify("权限模式已更新"); return;
