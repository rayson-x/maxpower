plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.posecamera'
version = '0.1.0'
def rustJniDir = file("$buildDir/rustJni")
def generatedPoseAssetsDir = file("$buildDir/generated/poseAssets")
def projectRootDir = rootProject.projectDir.parentFile

android {
  namespace "expo.modules.posecamera"
  ndkVersion "27.1.12297006"
  packaging {
    jniLibs {
      pickFirsts += ["**/libc++_shared.so"]
    }
  }
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    consumerProguardFiles "consumer-rules.pro"
    externalNativeBuild {
      cmake {
        cppFlags "-std=c++17"
      }
    }
  }
  externalNativeBuild {
    cmake {
      path "src/main/cpp/CMakeLists.txt"
      version "3.22.1"
    }
  }
  sourceSets {
    main {
      // The Rust task is the single Android native-library source. Using +=
      // also retains Gradle's implicit src/main/jniLibs directory, which can
      // package a stale checked-in .so beside the freshly built one.
      jniLibs.srcDirs = [rustJniDir]
      assets.srcDirs += generatedPoseAssetsDir
    }
    androidTest {
      assets.srcDirs += file("${rootProject.projectDir.parentFile}/tools/motion-sdk/fixtures")
    }
  }
  lintOptions {
    abortOnError false
  }
}

tasks.register("buildRustAndroid", Exec) {
  workingDir projectRootDir
  commandLine "sh", "tools/motion-sdk/build-native.sh", "android", rustJniDir.absolutePath
  inputs.files(
    fileTree("${rootProject.projectDir.parentFile}/rust/motion-sdk/src"),
    file("${rootProject.projectDir.parentFile}/tools/motion-sdk/build-native.sh"),
    file("${rootProject.projectDir.parentFile}/Cargo.toml"),
    file("${rootProject.projectDir.parentFile}/rust/motion-sdk/Cargo.toml"),
    file("${rootProject.projectDir.parentFile}/Cargo.lock")
  )
  outputs.dir rustJniDir
}

tasks.register("verifyPinnedPoseModels", Exec) {
  workingDir projectRootDir
  commandLine "node", "tools/client-realtime-agent/fetch-web-vision-models.mjs", "--verify"
  inputs.files(
    file("${projectRootDir}/tools/client-realtime-agent/web-vision-models.json"),
    file("${projectRootDir}/tools/client-realtime-agent/fetch-web-vision-models.mjs"),
    file("${projectRootDir}/public/models/yolox-nano-humanart-416x416.onnx"),
    file("${projectRootDir}/public/models/rtmpose-m-halpe26-256x192.onnx")
  )
}

tasks.register("preparePoseModels", Sync) {
  dependsOn("verifyPinnedPoseModels")
  from("${projectRootDir}/public/models") {
    include "yolox-nano-humanart-416x416.onnx"
    include "rtmpose-m-halpe26-256x192.onnx"
    into "models"
  }
  into generatedPoseAssetsDir
}

tasks.register("verifyRustAndroidOutputs", Exec) {
  dependsOn("buildRustAndroid")
  workingDir projectRootDir
  commandLine "node", "tools/motion-sdk/preflight-native.mjs", "android", "--artifacts", rustJniDir.absolutePath
  inputs.file(file("${projectRootDir}/tools/motion-sdk/preflight-native.mjs"))
  inputs.dir rustJniDir
}

tasks.register("preparePoseCameraNative") {
  dependsOn("verifyPinnedPoseModels", "preparePoseModels", "verifyRustAndroidOutputs")
}

tasks.named("buildRustAndroid") {
  mustRunAfter("verifyPinnedPoseModels")
}

tasks.configureEach { task ->
  if (task.name == "preBuild") task.dependsOn("preparePoseCameraNative")
}

dependencies {
  def camerax_version = "1.4.2"
  implementation "androidx.camera:camera-core:$camerax_version"
  implementation "androidx.camera:camera-camera2:$camerax_version"
  implementation "androidx.camera:camera-lifecycle:$camerax_version"
  implementation "androidx.camera:camera-view:$camerax_version"
  implementation "androidx.camera:camera-video:$camerax_version"
  implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.24.2'
  androidTestImplementation 'androidx.test:runner:1.6.2'
  androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
