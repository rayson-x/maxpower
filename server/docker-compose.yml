x-container: &container
  build:
    context: .
  image: maxpower-server:${MAXPOWER_IMAGE_TAG:-local}
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  volumes:
    - "${MAXPOWER_CA_CERT_PATH:-../maxpower-infra/pki/ca.crt}:/etc/maxpower/pki/ca.crt:ro"
  networks:
    - private

x-runtime: &runtime
  <<: *container
  env_file:
    - path: .env
      required: false
  environment:
    - NODE_ENV=production
    - MAXPOWER_RUNTIME=production
    - NODE_EXTRA_CA_CERTS=/etc/maxpower/pki/ca.crt
    - STREAM_REDIS_PERSISTENCE=disabled
  restart: unless-stopped

services:
  api:
    <<: *runtime
    expose:
      - "8787"
    ports:
      - "${MAXPOWER_BIND_ADDRESS:-0.0.0.0}:${MAXPOWER_HOST_PORT:-3000}:8787"
    stop_grace_period: 30s

  worker:
    <<: *runtime
    command: ["node", "dist/worker.js"]
    healthcheck:
      disable: true
    stop_grace_period: 30s

  migrate:
    <<: *container
    command: ["node", "dist/migrate.js"]
    environment:
      NODE_ENV: production
      NODE_EXTRA_CA_CERTS: /etc/maxpower/pki/ca.crt
      DATABASE_URL: ${DATABASE_URL:-}
    restart: "no"
    profiles: ["ops"]
    healthcheck:
      disable: true

networks:
  private:
    external: true
    name: ${MAXPOWER_PRIVATE_NETWORK:-maxpower-private}
